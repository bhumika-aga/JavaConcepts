                  />
                  <rect
                    x="12"
                    y="100"
                    width="40"
                    height="30"
                    rx="4"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="1.5"
                  />
                  <rect
                    x="12"
                    y="136"
                    width="40"
                    height="30"
                    rx="4"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="1.5"
                  />

                  <line
                    x1="58"
                    y1="96"
                    x2="98"
                    y2="96"
                    stroke="currentColor"
                    stroke-width="2"
