                  />
                  <text
                    x="388"
                    y="152"
                    text-anchor="middle"
                    font-size="11"
                    font-weight="600"
                    fill="var(--val)">
                    worker 3 — busy
                  </text>
                  <text
                    x="388"
                    y="186"
                    text-anchor="middle"
                    font-size="10"
