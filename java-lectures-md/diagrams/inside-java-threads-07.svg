                  </text>
                  <text
                    x="486"
                    y="112"
                    font-size="10.5"
                    fill="var(--ink-faint)">
                    Reject loudly, or run on the
                  </text>
                  <text
                    x="486"
                    y="128"
                    font-size="10.5"
                    fill="var(--ink-faint)">
                    caller's thread to slow it down.
                  </text>
                  <text
                    x="486"
                    y="152"
                    font-size="10.5"
                    fill="var(--ink-faint)">
                    An UNBOUNDED queue here is
                  </text>
                  <text x="486" y="168" font-size="10.5" fill="var(--hot)">
                    how you get an OutOfMemoryError.
                  </text>
                </g>
              </svg>