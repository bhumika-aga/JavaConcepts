<svg xmlns="http://www.w3.org/2000/svg" width="700" height="270"
                viewBox="0 0 700 270"
                role="img"
                aria-label="Four partitions distributed across two, four and five consumers, showing that a fifth consumer sits idle"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <g font-family="JetBrains Mono, monospace" font-size="11">
                  <text x="12" y="16" font-size="10.5" fill="var(--ink-faint)">
                    TOPIC WITH 4 PARTITIONS
                  </text>

                  <text
                    x="12"
                    y="44"
                    font-size="11"
                    font-weight="700"
                    fill="var(--val)">
                    2 consumers — 2 partitions each
                  </text>
                  <g>
                    <rect
                      x="12"
                      y="52"
                      width="76"
                      height="26"
                      rx="4"
                      fill="var(--val-bg)"
                      stroke="var(--val)"
                      stroke-width="1.5"
                    />
                    <text x="50" y="70" text-anchor="middle" fill="var(--val)">
                      P0 P1
                    </text>
                    <text
                      x="96"
                      y="70"
                      font-size="10.5"
                      fill="var(--ink-faint)">
                      → C1
                    </text>
                    <rect
                      x="150"
                      y="52"
                      width="76"
                      height="26"
                      rx="4"
                      fill="var(--val-bg)"
                      stroke="var(--val)"
                      stroke-width="1.5"
                    />
                    <text x="188" y="70" text-anchor="middle" fill="var(--val)">
                      P2 P3
                    </text>
                    <text
                      x="234"
                      y="70"
                      font-size="10.5"
                      fill="var(--ink-faint)">
                      → C2
                    </text>
                    <text x="300" y="70" font-size="10.5" fill="var(--good)">
                      ✓ balanced
                    </text>
                  </g>

                  <line
                    x1="12"
                    y1="96"
                    x2="688"
                    y2="96"
                    stroke="var(--rule)"
                    stroke-width="1"
                  />

                  <text
                    x="12"
                    y="122"
                    font-size="11"
                    font-weight="700"
                    fill="var(--val)">
                    4 consumers — 1 each, maximum parallelism
                  </text>
                  <g>
                    <rect
                      x="12"
                      y="130"
                      width="52"
                      height="26"
                      rx="4"
                      fill="var(--val-bg)"
                      stroke="var(--val)"
                      stroke-width="1.5"
                    />
                    <text x="38" y="148" text-anchor="middle" fill="var(--val)">
                      P0
                    </text>
                    <rect
                      x="76"
                      y="130"
                      width="52"
                      height="26"
                      rx="4"
                      fill="var(--val-bg)"
                      stroke="var(--val)"
                      stroke-width="1.5"
                    />
                    <text
                      x="102"
                      y="148"
                      text-anchor="middle"
                      fill="var(--val)">
                      P1
                    </text>
                    <rect
                      x="140"
                      y="130"
                      width="52"
                      height="26"
                      rx="4"
                      fill="var(--val-bg)"
                      stroke="var(--val)"
                      stroke-width="1.5"
                    />
                    <text
                      x="166"
                      y="148"
                      text-anchor="middle"
                      fill="var(--val)">
                      P2
                    </text>
                    <rect
                      x="204"
                      y="130"
                      width="52"
                      height="26"
                      rx="4"
                      fill="var(--val-bg)"
                      stroke="var(--val)"
                      stroke-width="1.5"
                    />
                    <text
                      x="230"
                      y="148"
                      text-anchor="middle"
                      fill="var(--val)">
                      P3
                    </text>
                    <text x="270" y="148" font-size="10.5" fill="var(--good)">
                      ✓ the sweet spot
                    </text>
                  </g>

                  <line
                    x1="12"
                    y1="174"
                    x2="688"
                    y2="174"
                    stroke="var(--rule)"
                    stroke-width="1"
                  />

                  <text
                    x="12"
                    y="200"
                    font-size="11"
                    font-weight="700"
                    fill="var(--hot)">
                    5 consumers — the fifth gets nothing
                  </text>
                  <g>
                    <rect
                      x="12"
                      y="208"
                      width="52"
                      height="26"
                      rx="4"
                      fill="var(--val-bg)"
                      stroke="var(--val)"
                      stroke-width="1.5"
                    />
                    <text x="38" y="226" text-anchor="middle" fill="var(--val)">
                      P0
                    </text>
                    <rect
                      x="76"
                      y="208"
                      width="52"
                      height="26"
                      rx="4"
                      fill="var(--val-bg)"
                      stroke="var(--val)"
                      stroke-width="1.5"
                    />
                    <text
                      x="102"
                      y="226"
                      text-anchor="middle"
                      fill="var(--val)">
                      P1
                    </text>
                    <rect
                      x="140"
                      y="208"
                      width="52"
                      height="26"
                      rx="4"
                      fill="var(--val-bg)"
                      stroke="var(--val)"
                      stroke-width="1.5"
                    />
                    <text
                      x="166"
                      y="226"
                      text-anchor="middle"
                      fill="var(--val)">
                      P2
                    </text>
                    <rect
                      x="204"
                      y="208"
                      width="52"
                      height="26"
                      rx="4"
                      fill="var(--val-bg)"
                      stroke="var(--val)"
                      stroke-width="1.5"
                    />
                    <text
                      x="230"
                      y="226"
                      text-anchor="middle"
                      fill="var(--val)">
                      P3
                    </text>
                    <rect
                      x="268"
                      y="208"
                      width="76"
                      height="26"
                      rx="4"
                      fill="none"
                      stroke="var(--hot)"
                      stroke-width="2"
                      stroke-dasharray="5 4"
                    />
                    <text
                      x="306"
                      y="226"
                      text-anchor="middle"
                      font-size="10.5"
                      fill="var(--hot)">
                      C5 idle
                    </text>
                    <text x="360" y="226" font-size="10.5" fill="var(--hot)">
                      adding consumers past the partition count buys nothing
                    </text>
                  </g>

                  <text x="12" y="260" font-size="10.5" fill="var(--ink-soft)">
                    Different groups are independent: a second group reads the
                    same partitions with its own offsets.
                  </text>
                </g>
              </svg>