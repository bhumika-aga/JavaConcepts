<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240"
                viewBox="0 0 700 240"
                role="img"
                aria-label="The internal layout of an executable Spring Boot jar showing the loader, application classes, nested dependency jars and the manifest entries"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <g font-family="JetBrains Mono, monospace" font-size="11">
                  <rect
                    x="12"
                    y="30"
                    width="330"
                    height="192"
                    rx="9"
                    fill="var(--surface)"
                    stroke="var(--ink)"
                    stroke-width="2.5"
                  />
                  <text
                    x="177"
                    y="52"
                    text-anchor="middle"
                    font-size="11.5"
                    font-weight="700"
                    fill="var(--ink)">
                    app.jar
                  </text>

                  <rect
                    x="30"
                    y="62"
                    width="294"
                    height="34"
                    rx="5"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="2"
                  />
                  <text
                    x="44"
                    y="83"
                    font-size="10.5"
                    font-weight="700"
                    fill="var(--key)">
                    org/springframework/boot/loader/
                  </text>

                  <rect
                    x="30"
                    y="102"
                    width="294"
                    height="34"
                    rx="5"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2"
                  />
                  <text
                    x="44"
                    y="123"
                    font-size="10.5"
                    font-weight="700"
                    fill="var(--val)">
                    BOOT-INF/classes/ ← your code
                  </text>

                  <rect
                    x="30"
                    y="142"
                    width="294"
                    height="34"
                    rx="5"
                    fill="var(--tree-bg)"
                    stroke="var(--tree)"
                    stroke-width="2"
                  />
                  <text
                    x="44"
                    y="163"
                    font-size="10.5"
                    font-weight="700"
                    fill="var(--tree)">
                    BOOT-INF/lib/ ← ~30 nested jars
                  </text>

                  <rect
                    x="30"
                    y="182"
                    width="294"
                    height="30"
                    rx="5"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.8"
                  />
                  <text x="44" y="202" font-size="10.5" fill="var(--ink-soft)">
                    META-INF/MANIFEST.MF
                  </text>

                  <rect
                    x="360"
                    y="60"
                    width="326"
                    height="76"
                    rx="8"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="2"
                  />
                  <text
                    x="374"
                    y="82"
                    font-size="10.5"
                    font-weight="700"
                    fill="var(--ink)">
                    Main-Class: …loader.launch.JarLauncher
                  </text>
                  <text
                    x="374"
                    y="100"
                    font-size="10.5"
                    font-weight="700"
                    fill="var(--ink)">
                    Start-Class: com.example.App
                  </text>
                  <text x="374" y="122" font-size="10" fill="var(--ink-faint)">
                    the JVM runs the launcher, not you
                  </text>

                  <rect
                    x="360"
                    y="148"
                    width="326"
                    height="74"
                    rx="8"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="2"
                  />
                  <text
                    x="374"
                    y="170"
                    font-size="10.5"
                    font-weight="700"
                    fill="var(--key)">
                    Why a launcher at all?
                  </text>
                  <text x="374" y="188" font-size="10" fill="var(--key)">
                    A standard classloader cannot read a jar
                  </text>
                  <text x="374" y="203" font-size="10" fill="var(--key)">
                    inside a jar. Nested jars are STORED
                  </text>
                  <text x="374" y="218" font-size="10" fill="var(--key)">
                    uncompressed so they can be read in place.
                  </text>
                </g>
              </svg>