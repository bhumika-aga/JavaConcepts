<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300"
                viewBox="0 0 700 300"
                role="img"
                aria-label="Thread state machine showing transitions between new, runnable, blocked, waiting, timed waiting and terminated"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <defs>
                  <marker
                    id="a2"
                    viewBox="0 0 10 10"
                    refX="9"
                    refY="5"
                    markerWidth="6.5"
                    markerHeight="6.5"
                    orient="auto">
                    <path d="M0 0 L10 5 L0 10 z" fill="currentColor" />
                  </marker>
                </defs>
                <g
                  font-family="IBM Plex Mono, monospace"
                  font-size="11.5"
                  color="var(--ink-soft)">
                  <!-- NEW -->
                  <rect
                    x="16"
                    y="126"
                    width="104"
                    height="44"
                    rx="8"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="2"
                  />
                  <text
                    x="68"
                    y="153"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="600"
                    fill="var(--ink)">
                    NEW
                  </text>

                  <line
                    x1="122"
                    y1="148"
                    x2="176"
                    y2="148"
                    stroke="currentColor"
                    stroke-width="2"
                    marker-end="url(#a2)"
                  />
                  <text
                    x="149"
                    y="140"
                    text-anchor="middle"
                    font-size="10"
                    fill="var(--val)">
                    start()
                  </text>

                  <!-- RUNNABLE -->
                  <rect
                    x="180"
                    y="120"
                    width="130"
                    height="56"
                    rx="8"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2.5"
                  />
                  <text
                    x="245"
                    y="144"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="600"
                    fill="var(--val)">
                    RUNNABLE
                  </text>
                  <text
                    x="245"
                    y="162"
                    text-anchor="middle"
                    font-size="10"
                    fill="var(--ink-soft)">
                    running or ready
                  </text>

                  <!-- BLOCKED -->
                  <rect
                    x="384"
                    y="20"
                    width="150"
                    height="44"
                    rx="8"
                    fill="var(--hot-bg)"
                    stroke="var(--hot)"
                    stroke-width="2"
                  />
                  <text
                    x="459"
                    y="47"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="600"
                    fill="var(--hot)">
                    BLOCKED
                  </text>
                  <path
                    d="M300 124 C340 84, 360 48, 380 44"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    marker-end="url(#a2)"
                  />
                  <text x="316" y="76" font-size="10" fill="var(--ink-faint)">
                    waiting for a monitor
                  </text>

                  <!-- WAITING -->
                  <rect
                    x="384"
                    y="96"
                    width="150"
                    height="44"
                    rx="8"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="2"
                  />
                  <text
                    x="459"
                    y="123"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="600"
                    fill="var(--key)">
                    WAITING
                  </text>
                  <line
                    x1="314"
                    y1="134"
                    x2="380"
                    y2="122"
                    stroke="currentColor"
                    stroke-width="2"
                    marker-end="url(#a2)"
                  />
                  <text x="318" y="108" font-size="10" fill="var(--ink-faint)">
                    wait(), join()
                  </text>

                  <!-- TIMED -->
                  <rect
                    x="384"
                    y="172"
                    width="150"
                    height="44"
                    rx="8"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="2"
                  />
                  <text
                    x="459"
                    y="199"
                    text-anchor="middle"
                    font-size="11.5"
                    font-weight="600"
                    fill="var(--key)">
                    TIMED_WAITING
                  </text>
                  <line
                    x1="314"
                    y1="162"
                    x2="380"
                    y2="190"
                    stroke="currentColor"
                    stroke-width="2"
                    marker-end="url(#a2)"
                  />
                  <text x="318" y="186" font-size="10" fill="var(--ink-faint)">
                    sleep(n), wait(n)
                  </text>

                  <!-- back arrows -->
                  <path
                    d="M384 56 C344 96, 330 110, 312 116"
                    fill="none"
                    stroke="var(--good)"
                    stroke-width="1.8"
                    stroke-dasharray="5 4"
                    marker-end="url(#a2)"
                    color="var(--good)"
                  />
                  <path
                    d="M384 210 C340 214, 320 196, 306 180"
                    fill="none"
                    stroke="var(--good)"
                    stroke-width="1.8"
                    stroke-dasharray="5 4"
                    marker-end="url(#a2)"
                    color="var(--good)"
                  />
                  <text x="560" y="124" font-size="10" fill="var(--good)">
                    notify / timeout /
                  </text>
                  <text x="560" y="138" font-size="10" fill="var(--good)">
                    lock acquired
                  </text>

                  <!-- TERMINATED -->
                  <rect
                    x="180"
                    y="238"
                    width="130"
                    height="44"
                    rx="8"
                    fill="var(--surface-2)"
                    stroke="var(--ink)"
                    stroke-width="2"
                  />
                  <text
                    x="245"
                    y="265"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="600"
                    fill="var(--ink)">
                    TERMINATED
                  </text>
                  <line
                    x1="245"
                    y1="180"
                    x2="245"
                    y2="234"
                    stroke="currentColor"
                    stroke-width="2"
                    marker-end="url(#a2)"
                  />
                  <text x="255" y="210" font-size="10" fill="var(--ink-faint)">
                    run() returns or throws
                  </text>

                  <text x="16" y="290" font-size="10.5" fill="var(--ink-faint)">BLOCKED = waiting for a monitor. WAITING = parked until signalled. The state tells you which.</text>
                </g>
              </svg>