<svg xmlns="http://www.w3.org/2000/svg" width="700" height="270"
                viewBox="0 0 700 270"
                role="img"
                aria-label="A red-black tree of names with the search path to a key highlighted"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <g font-family="JetBrains Mono, monospace" font-size="12">
                  <!-- edges -->
                  <line
                    x1="350"
                    y1="56"
                    x2="200"
                    y2="112"
                    stroke="var(--key)"
                    stroke-width="3"
                  />
                  <line
                    x1="350"
                    y1="56"
                    x2="500"
                    y2="112"
                    stroke="var(--rule-strong)"
                    stroke-width="2"
                  />
                  <line
                    x1="200"
                    y1="126"
                    x2="120"
                    y2="182"
                    stroke="var(--rule-strong)"
                    stroke-width="2"
                  />
                  <line
                    x1="200"
                    y1="126"
                    x2="280"
                    y2="182"
                    stroke="var(--key)"
                    stroke-width="3"
                  />
                  <line
                    x1="500"
                    y1="126"
                    x2="430"
                    y2="182"
                    stroke="var(--rule-strong)"
                    stroke-width="2"
                  />
                  <line
                    x1="500"
                    y1="126"
                    x2="580"
                    y2="182"
                    stroke="var(--rule-strong)"
                    stroke-width="2"
                  />

                  <!-- nodes -->
                  <ellipse
                    cx="350"
                    cy="56"
                    rx="46"
                    ry="21"
                    fill="var(--ink)"
                    stroke="var(--ink)"
                    stroke-width="2"
                  />
                  <text
                    x="350"
                    y="61"
                    text-anchor="middle"
                    font-size="12.5"
                    font-weight="700"
                    fill="var(--surface)">
                    "dan"
                  </text>

                  <ellipse
                    cx="200"
                    cy="119"
                    rx="46"
                    ry="21"
                    fill="var(--hot)"
                    stroke="var(--hot)"
                    stroke-width="2"
                  />
                  <text
                    x="200"
                    y="124"
                    text-anchor="middle"
                    font-size="12.5"
                    font-weight="700"
                    fill="var(--bg)">
                    "bob"
                  </text>

                  <ellipse
                    cx="500"
                    cy="119"
                    rx="50"
                    ry="21"
                    fill="var(--hot)"
                    stroke="var(--hot)"
                    stroke-width="2"
                  />
                  <text
                    x="500"
                    y="124"
                    text-anchor="middle"
                    font-size="12.5"
                    font-weight="700"
                    fill="var(--bg)">
                    "frank"
                  </text>

                  <ellipse
                    cx="120"
                    cy="189"
                    rx="48"
                    ry="20"
                    fill="var(--ink)"
                    stroke="var(--ink)"
                    stroke-width="2"
                  />
                  <text
                    x="120"
                    y="194"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="700"
                    fill="var(--surface)">
                    "alice"
                  </text>

                  <ellipse
                    cx="280"
                    cy="189"
                    rx="48"
                    ry="20"
                    fill="var(--ink)"
                    stroke="var(--ink)"
                    stroke-width="2.5"
                  />
                  <text
                    x="280"
                    y="194"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="700"
                    fill="var(--surface)">
                    "carol"
                  </text>

                  <ellipse
                    cx="430"
                    cy="189"
                    rx="42"
                    ry="20"
                    fill="var(--ink)"
                    stroke="var(--ink)"
                    stroke-width="2"
                  />
                  <text
                    x="430"
                    y="194"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="700"
                    fill="var(--surface)">
                    "eve"
                  </text>

                  <ellipse
                    cx="580"
                    cy="189"
                    rx="42"
                    ry="20"
                    fill="var(--ink)"
                    stroke="var(--ink)"
                    stroke-width="2"
                  />
                  <text
                    x="580"
                    y="194"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="700"
                    fill="var(--surface)">
                    "gina"
                  </text>

                  <text
                    x="12"
                    y="26"
                    font-size="11"
                    font-weight="700"
                    fill="var(--key)">
                    get("carol") — two comparisons, then done
                  </text>
                  <text x="12" y="240" font-size="11" fill="var(--ink-faint)">
                    "carol" &lt; "dan" → go left. &nbsp; "carol" &gt; "bob" → go
                    right. &nbsp; Found.
                  </text>
                  <text x="12" y="260" font-size="11" fill="var(--ink-faint)">Red/black colouring keeps the tree from degenerating into a list — height stays ≤ 2·log₂(n+1).</text>
                </g>
              </svg>