<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220"
                viewBox="0 0 700 220"
                role="img"
                aria-label="Three threads with private stacks all reading and writing one shared heap"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <defs>
                  <marker
                    id="p1"
                    viewBox="0 0 10 10"
                    refX="9"
                    refY="5"
                    markerWidth="7"
                    markerHeight="7"
                    orient="auto">
                    <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-soft)" />
                  </marker>
                </defs>
                <g font-family="JetBrains Mono, monospace" font-size="11.5">
                  <text x="12" y="18" font-size="11" fill="var(--good)">
                    PRIVATE — safe by construction, no locking needed
                  </text>

                  <rect
                    x="14"
                    y="30"
                    width="206"
                    height="56"
                    rx="8"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2.5"
                  />
                  <text
                    x="117"
                    y="52"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="700"
                    fill="var(--val)">
                    thread 1 stack
                  </text>
                  <text
                    x="117"
                    y="72"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--val)">
                    locals, frames
                  </text>

                  <rect
                    x="246"
                    y="30"
                    width="206"
                    height="56"
                    rx="8"
                    fill="var(--tree-bg)"
                    stroke="var(--tree)"
                    stroke-width="2.5"
                  />
                  <text
                    x="349"
                    y="52"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="700"
                    fill="var(--tree)">
                    thread 2 stack
                  </text>
                  <text
                    x="349"
                    y="72"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--tree)">
                    locals, frames
                  </text>

                  <rect
                    x="478"
                    y="30"
                    width="206"
                    height="56"
                    rx="8"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="2.5"
                  />
                  <text
                    x="581"
                    y="52"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="700"
                    fill="var(--key)">
                    thread 3 stack
                  </text>
                  <text
                    x="581"
                    y="72"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--key)">
                    locals, frames
                  </text>

                  <line
                    x1="117"
                    y1="90"
                    x2="117"
                    y2="126"
                    stroke="var(--ink-soft)"
                    stroke-width="2"
                    marker-end="url(#p1)"
                  />
                  <line
                    x1="349"
                    y1="90"
                    x2="349"
                    y2="126"
                    stroke="var(--ink-soft)"
                    stroke-width="2"
                    marker-end="url(#p1)"
                  />
                  <line
                    x1="581"
                    y1="90"
                    x2="581"
                    y2="126"
                    stroke="var(--ink-soft)"
                    stroke-width="2"
                    marker-end="url(#p1)"
                  />

                  <rect
                    x="14"
                    y="130"
                    width="670"
                    height="60"
                    rx="10"
                    fill="var(--hot-bg)"
                    stroke="var(--hot)"
                    stroke-width="3"
                  />
                  <text
                    x="349"
                    y="156"
                    text-anchor="middle"
                    font-size="13"
                    font-weight="700"
                    fill="var(--hot)">
                    THE SHARED HEAP — every object, one copy
                  </text>
                  <text
                    x="349"
                    y="178"
                    text-anchor="middle"
                    font-size="11.5"
                    fill="var(--hot)">
                    everything dangerous lives here, and nowhere else
                  </text>

                  <text x="12" y="212" font-size="11" fill="var(--ink-soft)">
                    A local primitive can never be raced. Trouble begins the
                    moment two threads can reach the same object.
                  </text>
                </g>
              </svg>