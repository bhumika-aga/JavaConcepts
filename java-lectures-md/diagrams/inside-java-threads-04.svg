<svg xmlns="http://www.w3.org/2000/svg" width="700" height="236"
                viewBox="0 0 700 236"
                role="img"
                aria-label="A volatile write acting as a barrier that publishes all preceding writes to a second thread"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <defs>
                  <marker
                    id="a3"
                    viewBox="0 0 10 10"
                    refX="9"
                    refY="5"
                    markerWidth="6.5"
                    markerHeight="6.5"
                    orient="auto">
                    <path d="M0 0 L10 5 L0 10 z" fill="currentColor" />
                  </marker>
                </defs>
                <g font-family="IBM Plex Mono, monospace" font-size="11.5">
                  <text x="12" y="16" font-size="10.5" fill="var(--ink-faint)">
                    time →
                  </text>

                  <text
                    x="12"
                    y="58"
                    font-size="11.5"
                    font-weight="600"
                    fill="var(--val)">
                    Thread 1
                  </text>
                  <line
                    x1="92"
                    y1="54"
                    x2="688"
                    y2="54"
                    stroke="var(--val)"
                    stroke-width="1.5"
                    opacity=".35"
                  />
                  <rect
                    x="100"
                    y="38"
                    width="106"
                    height="32"
                    rx="5"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="153"
                    y="59"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--ink)">
                    name = "x"
                  </text>
                  <rect
                    x="214"
                    y="38"
                    width="106"
                    height="32"
                    rx="5"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="267"
                    y="59"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--ink)">
                    age = 30
                  </text>
                  <rect
                    x="330"
                    y="34"
                    width="146"
                    height="40"
                    rx="6"
                    fill="var(--surface-2)"
                    stroke="var(--good)"
                    stroke-width="2.5"
                  />
                  <text
                    x="403"
                    y="50"
                    text-anchor="middle"
                    font-size="10.5"
                    font-weight="600"
                    fill="var(--good)">
                    volatile write
                  </text>
                  <text
                    x="403"
                    y="65"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--good)">
                    ready = true
                  </text>

                  <!-- barrier -->
                  <line
                    x1="403"
                    y1="80"
                    x2="403"
                    y2="148"
                    stroke="var(--good)"
                    stroke-width="2.5"
                    stroke-dasharray="6 4"
                    marker-end="url(#a3)"
                    color="var(--good)"
                  />
                  <text
                    x="414"
                    y="116"
                    font-size="10.5"
                    font-weight="600"
                    fill="var(--good)">
                    happens-before
                  </text>

                  <text
                    x="12"
                    y="176"
                    font-size="11.5"
                    font-weight="600"
                    fill="var(--tree)">
                    Thread 2
                  </text>
                  <line
                    x1="92"
                    y1="172"
                    x2="688"
                    y2="172"
                    stroke="var(--tree)"
                    stroke-width="1.5"
                    opacity=".35"
                  />
                  <rect
                    x="330"
                    y="152"
                    width="146"
                    height="40"
                    rx="6"
                    fill="var(--surface-2)"
                    stroke="var(--good)"
                    stroke-width="2.5"
                  />
                  <text
                    x="403"
                    y="168"
                    text-anchor="middle"
                    font-size="10.5"
                    font-weight="600"
                    fill="var(--good)">
                    volatile read
                  </text>
                  <text
                    x="403"
                    y="183"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--good)">
                    if (ready)
                  </text>

                  <rect
                    x="490"
                    y="152"
                    width="196"
                    height="40"
                    rx="6"
                    fill="var(--tree-bg)"
                    stroke="var(--tree)"
                    stroke-width="1.8"
                  />
                  <text
                    x="588"
                    y="168"
                    text-anchor="middle"
                    font-size="10.5"
                    font-weight="600"
                    fill="var(--tree)">
                    sees name = "x"
                  </text>
                  <text
                    x="588"
                    y="183"
                    text-anchor="middle"
                    font-size="10.5"
                    font-weight="600"
                    fill="var(--tree)">
                    and age = 30
                  </text>

                  <text x="12" y="220" font-size="10.5" fill="var(--ink-faint)">The volatile write publishes EVERYTHING that preceded it — not just the volatile field.</text>
                </g>
              </svg>