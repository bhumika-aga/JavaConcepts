<svg xmlns="http://www.w3.org/2000/svg" width="700" height="236"
                viewBox="0 0 700 236"
                role="img"
                aria-label="The high 16 bits of a hash are XOR-ed into the low 16 bits before masking"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <g font-family="JetBrains Mono, monospace" font-size="12">
                  <text x="12" y="26" font-size="11" fill="var(--ink-faint)">
                    RAW HASH (32 bits)
                  </text>
                  <rect
                    x="12"
                    y="34"
                    width="330"
                    height="34"
                    rx="5"
                    fill="var(--hot-bg)"
                    stroke="var(--hot)"
                    stroke-width="2"
                  />
                  <text
                    x="177"
                    y="56"
                    text-anchor="middle"
                    font-size="12.5"
                    font-weight="700"
                    fill="var(--hot)">
                    1011 0010 1110 0101
                  </text>
                  <text
                    x="177"
                    y="84"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--ink-faint)">
                    high 16 — thrown away by the mask
                  </text>

                  <rect
                    x="350"
                    y="34"
                    width="330"
                    height="34"
                    rx="5"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="2"
                  />
                  <text
                    x="515"
                    y="56"
                    text-anchor="middle"
                    font-size="12.5"
                    font-weight="700"
                    fill="var(--ink)">
                    0001 1100 0110 1010
                  </text>
                  <text
                    x="515"
                    y="84"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--ink-faint)">
                    low 16 — the only part that counts
                  </text>

                  <path
                    d="M177 96 C177 120, 515 106, 515 128"
                    fill="none"
                    stroke="var(--key)"
                    stroke-width="2.5"
                    stroke-dasharray="5 4"
                  />
                  <circle
                    cx="515"
                    cy="132"
                    r="13"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="2"
                  />
                  <text
                    x="515"
                    y="137"
                    text-anchor="middle"
                    font-size="13"
                    font-weight="700"
                    fill="var(--key)">
                    ^
                  </text>
                  <text
                    x="330"
                    y="112"
                    font-size="11"
                    font-weight="700"
                    fill="var(--key)">
                    XOR down
                  </text>

                  <text x="12" y="176" font-size="11" fill="var(--ink-faint)">
                    SPREAD HASH — high bits now influence the low ones
                  </text>
                  <rect
                    x="12"
                    y="184"
                    width="668"
                    height="34"
                    rx="5"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2"
                  />
                  <text
                    x="346"
                    y="206"
                    text-anchor="middle"
                    font-size="12.5"
                    font-weight="700"
                    fill="var(--val)">
                    1011 0010 1110 0101 &nbsp;&nbsp; 1010 1110 1000 1111
                  </text>
                </g>
              </svg>