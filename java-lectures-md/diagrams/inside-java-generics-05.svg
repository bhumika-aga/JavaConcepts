<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220"
                viewBox="0 0 700 220"
                role="img"
                aria-label="Source code carrying type arguments compiles to bytecode where the parameters are replaced by their bounds and casts are inserted"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <defs>
                  <marker
                    id="g5"
                    viewBox="0 0 10 10"
                    refX="9"
                    refY="5"
                    markerWidth="7"
                    markerHeight="7"
                    orient="auto">
                    <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-soft)" />
                  </marker>
                </defs>
                <g font-family="JetBrains Mono, monospace" font-size="11">
                  <text x="12" y="18" font-size="11" fill="var(--val)">
                    WHAT YOU WRITE
                  </text>
                  <rect
                    x="12"
                    y="28"
                    width="290"
                    height="112"
                    rx="8"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2.5"
                  />
                  <text x="28" y="52" font-size="11" fill="var(--ink)">
                    class Box&lt;T&gt; {
                  </text>
                  <text x="28" y="72" font-size="11" fill="var(--ink)">
                    T item;
                  </text>
                  <text x="28" y="92" font-size="11" fill="var(--ink)">
                    T take() { return item; }
                  </text>
                  <text x="28" y="112" font-size="11" fill="var(--ink)">}</text>
                  <text x="28" y="132" font-size="11" fill="var(--val)">
                    String s = box.take();
                  </text>

                  <line
                    x1="310"
                    y1="84"
                    x2="358"
                    y2="84"
                    stroke="var(--ink-soft)"
                    stroke-width="2.5"
                    marker-end="url(#g5)"
                  />
                  <text
                    x="334"
                    y="76"
                    text-anchor="middle"
                    font-size="10"
                    fill="var(--ink-faint)">
                    javac
                  </text>

                  <text x="366" y="18" font-size="11" fill="var(--key)">
                    WHAT ACTUALLY RUNS
                  </text>
                  <rect
                    x="366"
                    y="28"
                    width="320"
                    height="112"
                    rx="8"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="2.5"
                  />
                  <text x="382" y="52" font-size="11" fill="var(--ink)">
                    class Box {
                  </text>
                  <text x="382" y="72" font-size="11" fill="var(--ink)">
                    Object item;
                  </text>
                  <text x="382" y="92" font-size="11" fill="var(--ink)">
                    Object take() { return item; }
                  </text>
                  <text x="382" y="112" font-size="11" fill="var(--ink)">
                    }
                  </text>
                  <text x="382" y="132" font-size="11" fill="var(--key)">
                    String s = (String) box.take();
                  </text>

                  <text x="12" y="170" font-size="11" fill="var(--ink-soft)">
                    T becomes its bound — Object when unbounded, Number for
                    &lt;T extends Number&gt;.
                  </text>
                  <text x="12" y="190" font-size="11" fill="var(--ink-soft)">
                    The casts you stopped writing did not disappear. The
                    compiler writes them for you.
                  </text>
                  <text
                    x="12"
                    y="210"
                    font-size="11"
                    font-weight="700"
                    fill="var(--key)">
                    Generics are a source-level feature with a bytecode-level
                    ghost.
                  </text>
                </g>
              </svg>