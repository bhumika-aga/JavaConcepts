<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250"
                viewBox="0 0 700 250"
                role="img"
                aria-label="A call stack with three frames, the newest on top, each holding its own locals"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <g font-family="JetBrains Mono, monospace" font-size="12">
                  <text x="12" y="20" font-size="11" fill="var(--ink-faint)">
                    grows downward as calls nest — only the top frame is
                    executing
                  </text>

                  <rect
                    x="150"
                    y="34"
                    width="330"
                    height="52"
                    rx="8"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="3"
                  />
                  <text
                    x="315"
                    y="56"
                    text-anchor="middle"
                    font-size="13"
                    font-weight="700"
                    fill="var(--val)">
                    chop() ← top, running now
                  </text>
                  <text
                    x="315"
                    y="76"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--val)">
                    int i, String name
                  </text>

                  <rect
                    x="150"
                    y="94"
                    width="330"
                    height="52"
                    rx="8"
                    fill="var(--surface)"
                    stroke="var(--rule-strong)"
                    stroke-width="2.5"
                  />
                  <text
                    x="315"
                    y="116"
                    text-anchor="middle"
                    font-size="13"
                    font-weight="700"
                    fill="var(--ink)">
                    cook()
                  </text>
                  <text
                    x="315"
                    y="136"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink-soft)">
                    List items, int total
                  </text>

                  <rect
                    x="150"
                    y="154"
                    width="330"
                    height="52"
                    rx="8"
                    fill="var(--surface)"
                    stroke="var(--rule-strong)"
                    stroke-width="2.5"
                  />
                  <text
                    x="315"
                    y="176"
                    text-anchor="middle"
                    font-size="13"
                    font-weight="700"
                    fill="var(--ink)">
                    main()
                  </text>
                  <text
                    x="315"
                    y="196"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink-soft)">
                    String[] args
                  </text>

                  <path
                    d="M508 60 L544 60 L544 180 L508 180"
                    fill="none"
                    stroke="var(--key)"
                    stroke-width="2.5"
                  />
                  <text x="556" y="112" font-size="11" fill="var(--key)">
                    pops in
                  </text>
                  <text x="556" y="128" font-size="11" fill="var(--key)">
                    reverse
                  </text>
                  <text x="556" y="144" font-size="11" fill="var(--key)">
                    order
                  </text>

                  <text x="12" y="234" font-size="11" fill="var(--ink-faint)">
                    A local primitive can never be involved in a race — no other
                    thread can reach this stack.
                  </text>
                </g>
              </svg>