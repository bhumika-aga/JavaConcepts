<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220"
                viewBox="0 0 700 220"
                role="img"
                aria-label="Committing before processing risks loss on a crash, committing after risks duplicates"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <g font-family="JetBrains Mono, monospace" font-size="11.5">
                  <text x="12" y="18" font-size="11" fill="var(--hot)">
                    COMMIT FIRST — at-most-once
                  </text>
                  <rect
                    x="12"
                    y="30"
                    width="120"
                    height="36"
                    rx="5"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="72"
                    y="53"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink)">
                    poll
                  </text>
                  <rect
                    x="140"
                    y="30"
                    width="120"
                    height="36"
                    rx="5"
                    fill="var(--hot-bg)"
                    stroke="var(--hot)"
                    stroke-width="2"
                  />
                  <text
                    x="200"
                    y="53"
                    text-anchor="middle"
                    font-size="11"
                    font-weight="700"
                    fill="var(--hot)">
                    commit
                  </text>
                  <rect
                    x="268"
                    y="30"
                    width="120"
                    height="36"
                    rx="5"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="328"
                    y="53"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink)">
                    process
                  </text>
                  <text
                    x="404"
                    y="53"
                    font-size="11"
                    font-weight="700"
                    fill="var(--hot)">
                    ✗ crash here → message never processed
                  </text>

                  <line
                    x1="12"
                    y1="88"
                    x2="688"
                    y2="88"
                    stroke="var(--rule)"
                    stroke-width="1"
                  />

                  <text x="12" y="114" font-size="11" fill="var(--val)">
                    PROCESS FIRST — at-least-once (what you almost always want)
                  </text>
                  <rect
                    x="12"
                    y="126"
                    width="120"
                    height="36"
                    rx="5"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="72"
                    y="149"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink)">
                    poll
                  </text>
                  <rect
                    x="140"
                    y="126"
                    width="120"
                    height="36"
                    rx="5"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="200"
                    y="149"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink)">
                    process
                  </text>
                  <rect
                    x="268"
                    y="126"
                    width="120"
                    height="36"
                    rx="5"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2"
                  />
                  <text
                    x="328"
                    y="149"
                    text-anchor="middle"
                    font-size="11"
                    font-weight="700"
                    fill="var(--val)">
                    commit
                  </text>
                  <text
                    x="404"
                    y="149"
                    font-size="11"
                    font-weight="700"
                    fill="var(--key)">
                    crash here → reprocessed on restart
                  </text>

                  <rect
                    x="12"
                    y="180"
                    width="676"
                    height="30"
                    rx="6"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2"
                  />
                  <text
                    x="350"
                    y="200"
                    text-anchor="middle"
                    font-size="11.5"
                    font-weight="700"
                    fill="var(--val)">
                    So make process() idempotent, and duplicates stop mattering.
                  </text>
                </g>
              </svg>