<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290" role="img" aria-label="One tree traversed four ways, showing the output sequence produced by in-order, pre-order, post-order and level-order"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
        <g font-family="JetBrains Mono, monospace" font-size="11">
          <line x1="150" y1="42" x2="90" y2="90" stroke="var(--rule-strong)" stroke-width="2"/>
          <line x1="150" y1="42" x2="210" y2="90" stroke="var(--rule-strong)" stroke-width="2"/>
          <line x1="90" y1="116" x2="50" y2="160" stroke="var(--rule-strong)" stroke-width="2"/>
          <line x1="90" y1="116" x2="130" y2="160" stroke="var(--rule-strong)" stroke-width="2"/>

          <circle cx="150" cy="36" r="20" fill="var(--key-bg)" stroke="var(--key)" stroke-width="2.5"/>
          <text x="150" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="var(--key)">F</text>
          <circle cx="90" cy="104" r="19" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
          <text x="90" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">B</text>
          <circle cx="210" cy="104" r="19" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
          <text x="210" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">G</text>
          <circle cx="50" cy="174" r="18" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
          <text x="50" y="180" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">A</text>
          <circle cx="130" cy="174" r="18" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
          <text x="130" y="180" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">D</text>

          <rect x="270" y="20" width="416" height="52" rx="7" fill="var(--val-bg)" stroke="var(--val)" stroke-width="2.5"/>
          <text x="286" y="40" font-size="11" font-weight="700" fill="var(--val)">IN-ORDER   left · NODE · right</text>
          <text x="286" y="58" font-size="12" font-weight="700" fill="var(--val)">A B D F G</text>
          <text x="500" y="58" font-size="10" fill="var(--val)">← sorted, for a BST</text>

          <rect x="270" y="80" width="416" height="52" rx="7" fill="var(--surface-2)" stroke="var(--rule-strong)" stroke-width="2"/>
          <text x="286" y="100" font-size="11" font-weight="700" fill="var(--ink)">PRE-ORDER   NODE · left · right</text>
          <text x="286" y="118" font-size="12" font-weight="700" fill="var(--ink)">F B A D G</text>
          <text x="500" y="118" font-size="10" fill="var(--ink-faint)">← copying, serialising</text>

          <rect x="270" y="140" width="416" height="52" rx="7" fill="var(--surface-2)" stroke="var(--rule-strong)" stroke-width="2"/>
          <text x="286" y="160" font-size="11" font-weight="700" fill="var(--ink)">POST-ORDER   left · right · NODE</text>
          <text x="286" y="178" font-size="12" font-weight="700" fill="var(--ink)">A D B G F</text>
          <text x="500" y="178" font-size="10" fill="var(--ink-faint)">← deleting, evaluating</text>

          <rect x="270" y="200" width="416" height="52" rx="7" fill="var(--key-bg)" stroke="var(--key)" stroke-width="2.5"/>
          <text x="286" y="220" font-size="11" font-weight="700" fill="var(--key)">LEVEL-ORDER   row by row</text>
          <text x="286" y="238" font-size="12" font-weight="700" fill="var(--key)">F B G A D</text>
          <text x="500" y="238" font-size="10" fill="var(--key)">← a queue, not recursion</text>

          <text x="12" y="276" font-size="10.5" fill="var(--ink-soft)">The first three differ only in where the visit sits among the two recursive calls.</text>
        </g>
      </svg>