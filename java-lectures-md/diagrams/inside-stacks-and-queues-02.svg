<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220"
                viewBox="0 0 700 220"
                role="img"
                aria-label="Two thread stacks holding references that both point at one shared object on the heap"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <defs>
                  <marker
                    id="s1"
                    viewBox="0 0 10 10"
                    refX="9"
                    refY="5"
                    markerWidth="7"
                    markerHeight="7"
                    orient="auto">
                    <path d="M0 0 L10 5 L0 10 z" fill="var(--key)" />
                  </marker>
                </defs>
                <g font-family="JetBrains Mono, monospace" font-size="11.5">
                  <text x="12" y="18" font-size="11" fill="var(--ink-faint)">
                    STACKS — private
                  </text>
                  <rect
                    x="12"
                    y="28"
                    width="190"
                    height="60"
                    rx="8"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2.5"
                  />
                  <text
                    x="107"
                    y="50"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="700"
                    fill="var(--val)">
                    thread 1 frame
                  </text>
                  <text
                    x="107"
                    y="70"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--val)">
                    User u → #4417
                  </text>

                  <rect
                    x="12"
                    y="100"
                    width="190"
                    height="60"
                    rx="8"
                    fill="var(--tree-bg)"
                    stroke="var(--tree)"
                    stroke-width="2.5"
                  />
                  <text
                    x="107"
                    y="122"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="700"
                    fill="var(--tree)">
                    thread 2 frame
                  </text>
                  <text
                    x="107"
                    y="142"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--tree)">
                    User other → #4417
                  </text>

                  <line
                    x1="208"
                    y1="58"
                    x2="366"
                    y2="94"
                    stroke="var(--key)"
                    stroke-width="2.5"
                    marker-end="url(#s1)"
                  />
                  <line
                    x1="208"
                    y1="130"
                    x2="366"
                    y2="112"
                    stroke="var(--key)"
                    stroke-width="2.5"
                    marker-end="url(#s1)"
                  />

                  <text x="380" y="18" font-size="11" fill="var(--ink-faint)">
                    THE HEAP — shared
                  </text>
                  <rect
                    x="374"
                    y="28"
                    width="312"
                    height="150"
                    rx="10"
                    fill="var(--surface-2)"
                    stroke="var(--ink)"
                    stroke-width="3"
                  />
                  <rect
                    x="404"
                    y="80"
                    width="150"
                    height="52"
                    rx="8"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="2.5"
                  />
                  <text
                    x="479"
                    y="102"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="700"
                    fill="var(--key)">
                    object #4417
                  </text>
                  <text
                    x="479"
                    y="120"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--key)">
                    name: "Ada"
                  </text>
                  <text
                    x="530"
                    y="160"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--ink-faint)">
                    one object, two references
                  </text>

                  <text x="12" y="200" font-size="11" fill="var(--ink-soft)">The reference lives on the stack. The object lives on the heap. Two threads can share one reference —</text>
                  <text x="12" y="216" font-size="11" fill="var(--ink-soft)">
                    which is exactly when you need the concurrency machinery.
                  </text>
                </g>
              </svg>