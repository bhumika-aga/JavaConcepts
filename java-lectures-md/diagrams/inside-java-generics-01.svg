<svg xmlns="http://www.w3.org/2000/svg" width="700" height="210"
                viewBox="0 0 700 210"
                role="img"
                aria-label="Without generics an error surfaces at runtime after a cast; with generics the same error is caught at compile time"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <defs>
                  <marker
                    id="g1"
                    viewBox="0 0 10 10"
                    refX="9"
                    refY="5"
                    markerWidth="7"
                    markerHeight="7"
                    orient="auto">
                    <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-soft)" />
                  </marker>
                </defs>
                <g font-family="JetBrains Mono, monospace" font-size="11.5">
                  <text x="12" y="18" font-size="11" fill="var(--hot)">
                    WITHOUT GENERICS — the error travels
                  </text>
                  <rect
                    x="12"
                    y="28"
                    width="112"
                    height="38"
                    rx="6"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="68"
                    y="52"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink)">
                    you write it
                  </text>
                  <line
                    x1="128"
                    y1="47"
                    x2="164"
                    y2="47"
                    stroke="var(--ink-soft)"
                    stroke-width="2"
                    marker-end="url(#g1)"
                  />
                  <rect
                    x="168"
                    y="28"
                    width="112"
                    height="38"
                    rx="6"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="224"
                    y="52"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink)">
                    it compiles
                  </text>
                  <line
                    x1="284"
                    y1="47"
                    x2="320"
                    y2="47"
                    stroke="var(--ink-soft)"
                    stroke-width="2"
                    marker-end="url(#g1)"
                  />
                  <rect
                    x="324"
                    y="28"
                    width="112"
                    height="38"
                    rx="6"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="380"
                    y="52"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink)">
                    it ships
                  </text>
                  <line
                    x1="440"
                    y1="47"
                    x2="476"
                    y2="47"
                    stroke="var(--hot)"
                    stroke-width="2"
                    marker-end="url(#g1)"
                  />
                  <rect
                    x="480"
                    y="24"
                    width="206"
                    height="46"
                    rx="6"
                    fill="var(--hot-bg)"
                    stroke="var(--hot)"
                    stroke-width="2.5"
                  />
                  <text
                    x="583"
                    y="44"
                    text-anchor="middle"
                    font-size="11"
                    font-weight="700"
                    fill="var(--hot)">
                    ClassCastException
                  </text>
                  <text
                    x="583"
                    y="60"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--hot)">
                    in front of a customer
                  </text>

                  <line
                    x1="12"
                    y1="96"
                    x2="688"
                    y2="96"
                    stroke="var(--rule)"
                    stroke-width="1"
                  />

                  <text x="12" y="126" font-size="11" fill="var(--good)">
                    WITH GENERICS — the error stops at the first gate
                  </text>
                  <rect
                    x="12"
                    y="136"
                    width="112"
                    height="38"
                    rx="6"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="68"
                    y="160"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink)">
                    you write it
                  </text>
                  <line
                    x1="128"
                    y1="155"
                    x2="164"
                    y2="155"
                    stroke="var(--ink-soft)"
                    stroke-width="2"
                    marker-end="url(#g1)"
                  />
                  <rect
                    x="168"
                    y="132"
                    width="150"
                    height="46"
                    rx="6"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2.5"
                  />
                  <text
                    x="243"
                    y="152"
                    text-anchor="middle"
                    font-size="11"
                    font-weight="700"
                    fill="var(--val)">
                    compiler refuses
                  </text>
                  <text
                    x="243"
                    y="168"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--val)">
                    before anything runs
                  </text>
                  <text x="336" y="159" font-size="11" fill="var(--ink-faint)">
                    nothing downstream ever sees it
                  </text>
                </g>
              </svg>