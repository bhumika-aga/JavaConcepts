<svg xmlns="http://www.w3.org/2000/svg" width="700" height="200"
                viewBox="0 0 700 200"
                role="img"
                aria-label="An array of strings assigned to an object array accepts a wrong write and fails at runtime, while the generic equivalent is rejected at compile time"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <g font-family="JetBrains Mono, monospace" font-size="11">
                  <text x="12" y="18" font-size="11" fill="var(--hot)">
                    ARRAYS — covariant, and reified
                  </text>
                  <rect
                    x="12"
                    y="28"
                    width="320"
                    height="86"
                    rx="8"
                    fill="var(--hot-bg)"
                    stroke="var(--hot)"
                    stroke-width="2.5"
                  />
                  <text x="28" y="52" font-size="11" fill="var(--ink)">
                    String[] s = new String[2];
                  </text>
                  <text x="28" y="72" font-size="11" fill="var(--good)">
                    Object[] o = s; // allowed!
                  </text>
                  <text x="28" y="92" font-size="11" fill="var(--hot)">
                    o[0] = 42; // ArrayStoreException
                  </text>
                  <text x="12" y="134" font-size="10.5" fill="var(--ink-soft)">
                    Compiles fine. Blows up at runtime,
                  </text>
                  <text x="12" y="150" font-size="10.5" fill="var(--ink-soft)">
                    because the array knows it's a String[].
                  </text>

                  <text x="366" y="18" font-size="11" fill="var(--val)">
                    GENERICS — invariant, and erased
                  </text>
                  <rect
                    x="366"
                    y="28"
                    width="320"
                    height="86"
                    rx="8"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2.5"
                  />
                  <text x="382" y="52" font-size="11" fill="var(--ink)">
                    List&lt;String&gt; s = new ArrayList&lt;&gt;();
                  </text>
                  <text x="382" y="72" font-size="11" fill="var(--hot)">
                    List&lt;Object&gt; o = s; // ✗ won't compile
                  </text>
                  <text x="382" y="92" font-size="11" fill="var(--ink-faint)">
                    — no runtime failure is possible
                  </text>
                  <text x="366" y="134" font-size="10.5" fill="var(--ink-soft)">
                    Refused at the gate. The bad state
                  </text>
                  <text x="366" y="150" font-size="10.5" fill="var(--ink-soft)">
                    is unreachable rather than detected.
                  </text>

                  <text
                    x="12"
                    y="184"
                    font-size="11"
                    font-weight="700"
                    fill="var(--key)">
                    Same mistake, two philosophies: arrays catch it late and
                    loudly, generics prevent it early and quietly.
                  </text>
                </g>
              </svg>