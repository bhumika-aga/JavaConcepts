                  </text>

                  <g color="var(--val)">
                    <line
                      x1="542"
                      y1="58"
                      x2="572"
                      y2="46"
                      stroke="currentColor"
                      stroke-width="2.5"
                      marker-end="url(#b1)"
                    />
                  </g>
                  <rect
                    x="576"
                    y="24"
                    width="110"
                    height="42"
                    rx="7"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2.5"
                  />
                  <text
                    x="631"
                    y="42"
                    text-anchor="middle"
                    font-size="10.5"
                    font-weight="700"
                    fill="var(--val)">
                    matched
                  </text>
                  <text
                    x="631"
                    y="57"
                    text-anchor="middle"
                    font-size="9.5"
                    fill="var(--val)">
                    beans registered
                  </text>

                  <g color="var(--ink-faint)">
                    <line
                      x1="542"
                      y1="86"
                      x2="572"
                      y2="98"
                      stroke="currentColor"
                      stroke-width="2"
                      marker-end="url(#b1)"
                    />
                  </g>
                  <rect
                    x="576"
                    y="80"
                    width="110"
                    height="42"
                    rx="7"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.8"
                    stroke-dasharray="5 4"
                  />
                  <text
                    x="631"
                    y="98"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--ink-faint)">
                    skipped
                  </text>
                  <text
                    x="631"
                    y="113"
                    text-anchor="middle"
                    font-size="9.5"
                    fill="var(--ink-faint)">
                    costs nothing
                  </text>

                  <rect
                    x="12"
                    y="140"
                    width="674"
                    height="42"
                    rx="7"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2"
                  />
                  <text
                    x="350"
                    y="158"
                    text-anchor="middle"
                    font-size="11"
                    font-weight="700"
                    fill="var(--val)">
                    Your own beans are registered BEFORE auto-configuration
                    runs.
                  </text>
                  <text
                    x="350"
                    y="174"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--val)">
                    That ordering is the entire reason @ConditionalOnMissingBean
                    works.
                  </text>

                  <text x="12" y="208" font-size="10.5" fill="var(--ink-soft)">
                    Boot 2.7+ and 3.x read
                    META-INF/spring/…AutoConfiguration.imports.
                  </text>
                  <text x="12" y="226" font-size="10.5" fill="var(--ink-soft)">
                    Older versions used spring.factories — you will still meet
                    it in third-party libraries.
                  </text>
                </g>
              </svg>