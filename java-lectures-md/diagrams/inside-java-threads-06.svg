<svg xmlns="http://www.w3.org/2000/svg" width="700" height="200"
                viewBox="0 0 700 200"
                role="img"
                aria-label="A compare and swap loop reading a value, computing a new one, and retrying when another thread intervenes"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <defs>
                  <marker
                    id="a5"
                    viewBox="0 0 10 10"
                    refX="9"
                    refY="5"
                    markerWidth="6.5"
                    markerHeight="6.5"
                    orient="auto">
                    <path d="M0 0 L10 5 L0 10 z" fill="currentColor" />
                  </marker>
                </defs>
                <g
                  font-family="IBM Plex Mono, monospace"
                  font-size="11.5"
                  color="var(--ink-soft)">
                  <rect
                    x="16"
                    y="62"
                    width="118"
                    height="46"
                    rx="7"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.8"
                  />
                  <text
                    x="75"
                    y="82"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink)">
                    read current
                  </text>
                  <text
                    x="75"
                    y="98"
                    text-anchor="middle"
                    font-size="11"
                    font-weight="600"
                    fill="var(--val)">
                    v = 5
                  </text>

                  <line
                    x1="136"
                    y1="85"
                    x2="176"
                    y2="85"
                    stroke="currentColor"
                    stroke-width="2"
                    marker-end="url(#a5)"
                  />

                  <rect
                    x="180"
                    y="62"
                    width="132"
                    height="46"
                    rx="7"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.8"
                  />
                  <text
                    x="246"
                    y="82"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink)">
                    compute next
                  </text>
                  <text
                    x="246"
                    y="98"
                    text-anchor="middle"
                    font-size="11"
                    font-weight="600"
                    fill="var(--val)">
                    v + 1 = 6
                  </text>

                  <line
                    x1="314"
                    y1="85"
                    x2="354"
                    y2="85"
                    stroke="currentColor"
                    stroke-width="2"
                    marker-end="url(#a5)"
                  />

                  <rect
                    x="358"
                    y="54"
                    width="164"
                    height="62"
                    rx="7"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2.2"
                  />
                  <text
                    x="440"
                    y="76"
                    text-anchor="middle"
                    font-size="11"
                    font-weight="600"
                    fill="var(--val)">
                    compareAndSet
                  </text>
                  <text
                    x="440"
                    y="92"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--ink-soft)">
                    still 5? → write 6
                  </text>
                  <text
                    x="440"
                    y="107"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--ink-soft)">
                    one CPU instruction
                  </text>

                  <line
                    x1="524"
                    y1="72"
                    x2="576"
                    y2="72"
                    stroke="var(--good)"
                    stroke-width="2.2"
                    marker-end="url(#a5)"
                    color="var(--good)"
                  />
                  <rect
                    x="580"
                    y="52"
                    width="106"
                    height="40"
                    rx="7"
                    fill="var(--surface-2)"
                    stroke="var(--good)"
                    stroke-width="2"
                  />
                  <text
                    x="633"
                    y="76"
                    text-anchor="middle"
                    font-size="11"
                    font-weight="600"
                    fill="var(--good)">
                    success
                  </text>

                  <path
                    d="M440 120 C440 158, 200 168, 75 140 L75 114"
                    fill="none"
                    stroke="var(--hot)"
                    stroke-width="2.2"
                    stroke-dasharray="6 4"
                    marker-end="url(#a5)"
                    color="var(--hot)"
                  />
                  <text
                    x="250"
                    y="162"
                    font-size="10.5"
                    font-weight="600"
                    fill="var(--hot)">
                    failed — someone else changed it — retry with the new value
                  </text>
                </g>
              </svg>