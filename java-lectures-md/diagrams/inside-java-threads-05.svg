<svg xmlns="http://www.w3.org/2000/svg" width="700" height="216"
                viewBox="0 0 700 216"
                role="img"
                aria-label="Two threads acquiring two locks in opposite order, forming a circular wait"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <defs>
                  <marker
                    id="a4"
                    viewBox="0 0 10 10"
                    refX="9"
                    refY="5"
                    markerWidth="6.5"
                    markerHeight="6.5"
                    orient="auto">
                    <path d="M0 0 L10 5 L0 10 z" fill="currentColor" />
                  </marker>
                </defs>
                <g font-family="IBM Plex Mono, monospace" font-size="11.5">
                  <rect
                    x="60"
                    y="30"
                    width="140"
                    height="46"
                    rx="8"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2"
                  />
                  <text
                    x="130"
                    y="59"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="600"
                    fill="var(--val)">
                    Thread 1
                  </text>

                  <rect
                    x="500"
                    y="30"
                    width="140"
                    height="46"
                    rx="8"
                    fill="var(--tree-bg)"
                    stroke="var(--tree)"
                    stroke-width="2"
                  />
                  <text
                    x="570"
                    y="59"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="600"
                    fill="var(--tree)">
                    Thread 2
                  </text>

                  <rect
                    x="60"
                    y="146"
                    width="140"
                    height="46"
                    rx="8"
                    fill="var(--surface-2)"
                    stroke="var(--ink)"
                    stroke-width="2"
                  />
                  <text
                    x="130"
                    y="175"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="600"
                    fill="var(--ink)">
                    Lock A
                  </text>

                  <rect
                    x="500"
                    y="146"
                    width="140"
                    height="46"
                    rx="8"
                    fill="var(--surface-2)"
                    stroke="var(--ink)"
                    stroke-width="2"
                  />
                  <text
                    x="570"
                    y="175"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="600"
                    fill="var(--ink)">
                    Lock B
                  </text>

                  <!-- holds -->
                  <line
                    x1="130"
                    y1="80"
                    x2="130"
                    y2="142"
                    stroke="var(--good)"
                    stroke-width="2.5"
                    marker-end="url(#a4)"
                    color="var(--good)"
                  />
                  <text
                    x="138"
                    y="116"
                    font-size="10.5"
                    font-weight="600"
                    fill="var(--good)">
                    holds
                  </text>

                  <line
                    x1="570"
                    y1="80"
                    x2="570"
                    y2="142"
                    stroke="var(--good)"
                    stroke-width="2.5"
                    marker-end="url(#a4)"
                    color="var(--good)"
                  />
                  <text
                    x="578"
                    y="116"
                    font-size="10.5"
                    font-weight="600"
                    fill="var(--good)">
                    holds
                  </text>

                  <!-- wants (crossed) -->
                  <path
                    d="M204 56 C330 56, 420 130, 496 158"
                    fill="none"
                    stroke="var(--hot)"
                    stroke-width="2.5"
                    stroke-dasharray="6 4"
                    marker-end="url(#a4)"
                    color="var(--hot)"
                  />
                  <text
                    x="300"
                    y="88"
                    font-size="10.5"
                    font-weight="600"
                    fill="var(--hot)">
                    waits for B — forever
                  </text>

                  <path
                    d="M496 56 C370 56, 280 130, 204 158"
                    fill="none"
                    stroke="var(--hot)"
                    stroke-width="2.5"
                    stroke-dasharray="6 4"
                    marker-end="url(#a4)"
                    color="var(--hot)"
                  />
                  <text
                    x="300"
                    y="140"
                    font-size="10.5"
                    font-weight="600"
                    fill="var(--hot)">
                    waits for A — forever
                  </text>

                  <text x="12" y="212" font-size="10.5" fill="var(--ink-faint)">
                    The cycle is the deadlock. Break it by making every thread
                    take A before B — then no cycle can form.
                  </text>
                </g>
              </svg>