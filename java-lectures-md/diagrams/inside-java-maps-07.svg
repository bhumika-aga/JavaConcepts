<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280"
                viewBox="0 0 700 280"
                role="img"
                aria-label="Bucket array with a separate doubly-linked list threading through the entries in insertion order"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <defs>
                  <marker
                    id="ar4"
                    viewBox="0 0 10 10"
                    refX="9"
                    refY="5"
                    markerWidth="6"
                    markerHeight="6"
                    orient="auto">
                    <path d="M0 0 L10 5 L0 10 z" fill="var(--key)" />
                  </marker>
                </defs>
                <g font-family="JetBrains Mono, monospace" font-size="11.5">
                  <text x="12" y="20" font-size="11" fill="var(--ink-faint)">
                    BUCKETS decide where an entry lives (scattered by hash)
                  </text>

                  <rect
                    x="12"
                    y="34"
                    width="46"
                    height="30"
                    rx="4"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="35"
                    y="54"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink-faint)">
                    0
                  </text>
                  <rect
                    x="12"
                    y="70"
                    width="46"
                    height="30"
                    rx="4"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="35"
                    y="90"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink-faint)">
                    1
                  </text>
                  <rect
                    x="12"
                    y="106"
                    width="46"
                    height="30"
                    rx="4"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="35"
                    y="126"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink-faint)">
                    2
                  </text>
                  <rect
                    x="12"
                    y="142"
                    width="46"
                    height="30"
                    rx="4"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="35"
                    y="162"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink-faint)">
                    3
                  </text>
                  <rect
                    x="12"
                    y="178"
                    width="46"
                    height="30"
                    rx="4"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="35"
                    y="198"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink-faint)">
                    4
                  </text>

                  <!-- nodes, positioned by bucket -->
                  <line
                    x1="60"
                    y1="49"
                    x2="94"
                    y2="49"
                    stroke="var(--ink-soft)"
                    stroke-width="1.5"
                  />
                  <rect
                    x="98"
                    y="34"
                    width="104"
                    height="30"
                    rx="5"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="1.5"
                  />
                  <text x="150" y="54" text-anchor="middle" fill="var(--ink)">
                    "carol" 3rd
                  </text>

                  <line
                    x1="60"
                    y1="85"
                    x2="94"
                    y2="85"
                    stroke="var(--ink-soft)"
                    stroke-width="1.5"
                  />
                  <rect
                    x="98"
                    y="70"
                    width="104"
                    height="30"
                    rx="5"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="1.5"
                  />
                  <text x="150" y="90" text-anchor="middle" fill="var(--ink)">
                    "alice" 1st
                  </text>

                  <line
                    x1="60"
                    y1="157"
                    x2="94"
                    y2="157"
                    stroke="var(--ink-soft)"
                    stroke-width="1.5"
                  />
                  <rect
                    x="98"
                    y="142"
                    width="104"
                    height="30"
                    rx="5"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="1.5"
                  />
                  <text x="150" y="162" text-anchor="middle" fill="var(--ink)">
                    "dan" 4th
                  </text>

                  <line
                    x1="60"
                    y1="193"
                    x2="94"
                    y2="193"
                    stroke="var(--ink-soft)"
                    stroke-width="1.5"
                  />
                  <rect
                    x="98"
                    y="178"
                    width="104"
                    height="30"
                    rx="5"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="1.5"
                  />
                  <text x="150" y="198" text-anchor="middle" fill="var(--ink)">
                    "bob" 2nd
                  </text>

                  <!-- the overlay list -->
                  <text
                    x="250"
                    y="20"
                    font-size="11"
                    font-weight="700"
                    fill="var(--key)">
                    THE SECOND LIST decides what order you see them in
                  </text>
                  <text x="250" y="38" font-size="10.5" fill="var(--ink-faint)">
                    head → alice → bob → carol → dan → tail
                  </text>

                  <path
                    d="M204 85 C258 85, 258 193, 202 193"
                    fill="none"
                    stroke="var(--key)"
                    stroke-width="2.2"
                    marker-end="url(#ar4)"
                  />
                  <path
                    d="M204 193 C300 193, 300 49, 204 49"
                    fill="none"
                    stroke="var(--key)"
                    stroke-width="2.2"
                    marker-end="url(#ar4)"
                  />
                  <path
                    d="M204 49 C340 49, 340 157, 204 157"
                    fill="none"
                    stroke="var(--key)"
                    stroke-width="2.2"
                    marker-end="url(#ar4)"
                  />

                  <text x="380" y="120" font-size="11.5" fill="var(--ink-soft)">
                    Same nodes.
                  </text>
                  <text x="380" y="140" font-size="11.5" fill="var(--ink-soft)">
                    Two independent
                  </text>
                  <text x="380" y="160" font-size="11.5" fill="var(--ink-soft)">
                    sets of pointers.
                  </text>

                  <text x="12" y="240" font-size="11" fill="var(--ink-faint)">
                    Iteration follows the amber path — insertion order — and
                    never touches the buckets at all.
                  </text>
                  <text x="12" y="262" font-size="11" fill="var(--ink-faint)">
                    That also makes iteration O(size) rather than O(capacity):
                    no empty slots to skip.
                  </text>
                </g>
              </svg>