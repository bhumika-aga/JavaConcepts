<svg xmlns="http://www.w3.org/2000/svg" width="700" height="276" viewBox="0 0 700 276" role="img" aria-label="The same five keys inserted in sorted order producing a degenerate chain, versus balanced insertion producing a shallow tree"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
        <g font-family="JetBrains Mono, monospace" font-size="11">
          <text x="12" y="20" font-size="11" font-weight="700" fill="var(--hot)">inserted 10, 20, 30, 40, 50 — in that order</text>

          <line x1="60" y1="52" x2="100" y2="88" stroke="var(--hot)" stroke-width="2"/>
          <line x1="110" y1="110" x2="150" y2="146" stroke="var(--hot)" stroke-width="2"/>
          <line x1="160" y1="168" x2="200" y2="204" stroke="var(--hot)" stroke-width="2"/>
          <line x1="210" y1="226" x2="236" y2="244" stroke="var(--hot)" stroke-width="2"/>

          <circle cx="52" cy="44" r="18" fill="var(--hot-bg)" stroke="var(--hot)" stroke-width="2.5"/>
          <text x="52" y="49" text-anchor="middle" font-size="11" font-weight="700" fill="var(--hot)">10</text>
          <circle cx="108" cy="100" r="18" fill="var(--hot-bg)" stroke="var(--hot)" stroke-width="2.5"/>
          <text x="108" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="var(--hot)">20</text>
          <circle cx="158" cy="158" r="18" fill="var(--hot-bg)" stroke="var(--hot)" stroke-width="2.5"/>
          <text x="158" y="163" text-anchor="middle" font-size="11" font-weight="700" fill="var(--hot)">30</text>
          <circle cx="208" cy="216" r="18" fill="var(--hot-bg)" stroke="var(--hot)" stroke-width="2.5"/>
          <text x="208" y="221" text-anchor="middle" font-size="11" font-weight="700" fill="var(--hot)">40</text>
          <circle cx="252" cy="252" r="16" fill="var(--hot-bg)" stroke="var(--hot)" stroke-width="2.5"/>
          <text x="252" y="257" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--hot)">50</text>

          <text x="290" y="120" font-size="11" font-weight="700" fill="var(--hot)">height 4 — a list</text>
          <text x="290" y="138" font-size="10.5" fill="var(--hot)">find(50) costs 5 steps</text>
          <text x="290" y="156" font-size="10.5" fill="var(--hot)">O(n), not O(log n)</text>

          <line x1="410" y1="20" x2="410" y2="250" stroke="var(--rule)" stroke-width="1.5"/>

          <text x="430" y="20" font-size="11" font-weight="700" fill="var(--val)">the same keys, balanced</text>

          <line x1="560" y1="58" x2="500" y2="102" stroke="var(--val)" stroke-width="2"/>
          <line x1="560" y1="58" x2="620" y2="102" stroke="var(--val)" stroke-width="2"/>
          <line x1="500" y1="130" x2="462" y2="166" stroke="var(--val)" stroke-width="2"/>
          <line x1="620" y1="130" x2="658" y2="166" stroke="var(--val)" stroke-width="2"/>

          <circle cx="560" cy="52" r="19" fill="var(--val-bg)" stroke="var(--val)" stroke-width="2.5"/>
          <text x="560" y="57" text-anchor="middle" font-size="11" font-weight="700" fill="var(--val)">30</text>
          <circle cx="500" cy="116" r="18" fill="var(--val-bg)" stroke="var(--val)" stroke-width="2.5"/>
          <text x="500" y="121" text-anchor="middle" font-size="11" font-weight="700" fill="var(--val)">20</text>
          <circle cx="620" cy="116" r="18" fill="var(--val-bg)" stroke="var(--val)" stroke-width="2.5"/>
          <text x="620" y="121" text-anchor="middle" font-size="11" font-weight="700" fill="var(--val)">40</text>
          <circle cx="458" cy="180" r="17" fill="var(--val-bg)" stroke="var(--val)" stroke-width="2.5"/>
          <text x="458" y="185" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--val)">10</text>
          <circle cx="662" cy="180" r="17" fill="var(--val-bg)" stroke="var(--val)" stroke-width="2.5"/>
          <text x="662" y="185" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--val)">50</text>

          <text x="470" y="226" font-size="11" font-weight="700" fill="var(--val)">height 2 — find(50) costs 3</text>
          <text x="470" y="246" font-size="10.5" fill="var(--val)">self-balancing keeps it this way</text>
        </g>
      </svg>