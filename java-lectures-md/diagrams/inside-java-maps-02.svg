<svg xmlns="http://www.w3.org/2000/svg" width="860" height="190"
                viewBox="0 0 860 190"
                role="img"
                aria-label="A key is hashed, spread, masked, and turned into a bucket index"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <defs>
                  <marker
                    id="ar"
                    viewBox="0 0 10 10"
                    refX="9"
                    refY="5"
                    markerWidth="7"
                    markerHeight="7"
                    orient="auto">
                    <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-soft)" />
                  </marker>
                </defs>
                <g font-family="JetBrains Mono, monospace" font-size="13">
                  <!-- key -->
                  <rect
                    x="8"
                    y="52"
                    width="112"
                    height="52"
                    rx="8"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="2"
                  />
                  <text
                    x="64"
                    y="76"
                    text-anchor="middle"
                    font-size="14"
                    font-weight="700"
                    fill="var(--key)">
                    "alice"
                  </text>
                  <text
                    x="64"
                    y="94"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--ink-faint)">
                    the key
                  </text>
                  <line
                    x1="122"
                    y1="78"
                    x2="158"
                    y2="78"
                    stroke="var(--ink-soft)"
                    stroke-width="2"
                    marker-end="url(#ar)"
                  />

                  <!-- hashCode -->
                  <rect
                    x="162"
                    y="52"
                    width="152"
                    height="52"
                    rx="8"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="2"
                  />
                  <text
                    x="238"
                    y="74"
                    text-anchor="middle"
                    font-size="12.5"
                    font-weight="700"
                    fill="var(--ink)">
                    hashCode()
                  </text>
                  <text
                    x="238"
                    y="92"
                    text-anchor="middle"
                    font-size="12"
                    fill="var(--ink-soft)">
                    92902992
                  </text>
                  <line
                    x1="316"
                    y1="78"
                    x2="352"
                    y2="78"
                    stroke="var(--ink-soft)"
                    stroke-width="2"
                    marker-end="url(#ar)"
                  />

                  <!-- spread -->
                  <rect
                    x="356"
                    y="52"
                    width="168"
                    height="52"
                    rx="8"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="2"
                  />
                  <text
                    x="440"
                    y="74"
                    text-anchor="middle"
                    font-size="12.5"
                    font-weight="700"
                    fill="var(--ink)">
                    h ^ (h &gt;&gt;&gt; 16)
                  </text>
                  <text
                    x="440"
                    y="92"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink-faint)">
                    stir the high bits down
                  </text>
                  <line
                    x1="526"
                    y1="78"
                    x2="562"
                    y2="78"
                    stroke="var(--ink-soft)"
                    stroke-width="2"
                    marker-end="url(#ar)"
                  />

                  <!-- mask -->
                  <rect
                    x="566"
                    y="52"
                    width="132"
                    height="52"
                    rx="8"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="2"
                  />
                  <text
                    x="632"
                    y="74"
                    text-anchor="middle"
                    font-size="12.5"
                    font-weight="700"
                    fill="var(--ink)">
                    &amp; (n - 1)
                  </text>
                  <text
                    x="632"
                    y="92"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink-faint)">
                    keep low bits
                  </text>
                  <line
                    x1="700"
                    y1="78"
                    x2="736"
                    y2="78"
                    stroke="var(--ink-soft)"
                    stroke-width="2"
                    marker-end="url(#ar)"
                  />

                  <!-- bucket -->
                  <rect
                    x="740"
                    y="46"
                    width="112"
                    height="64"
                    rx="8"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2.5"
                  />
                  <text
                    x="796"
                    y="72"
                    text-anchor="middle"
                    font-size="12"
                    fill="var(--ink-soft)">
                    bucket
                  </text>
                  <text
                    x="796"
                    y="96"
                    text-anchor="middle"
                    font-size="20"
                    font-weight="700"
                    fill="var(--val)">
                    6
                  </text>

                  <text
                    x="430"
                    y="160"
                    text-anchor="middle"
                    font-size="12.5"
                    fill="var(--ink-faint)">
                    one arithmetic pass — no searching, no comparing, no walking
                    the wall
                  </text>
                </g>
              </svg>