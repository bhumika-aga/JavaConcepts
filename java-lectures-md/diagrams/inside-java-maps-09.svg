<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250"
                viewBox="0 0 700 250"
                role="img"
                aria-label="Four threads writing to four different buckets, only one of which needs a lock"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <g font-family="JetBrains Mono, monospace" font-size="11.5">
                  <text x="12" y="20" font-size="11" fill="var(--ink-faint)">
                    four threads, four buckets, no contention
                  </text>

                  <!-- bucket 0 -->
                  <rect
                    x="16"
                    y="88"
                    width="140"
                    height="42"
                    rx="6"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="2"
                    stroke-dasharray="5 4"
                  />
                  <text
                    x="86"
                    y="114"
                    text-anchor="middle"
                    font-size="11.5"
                    fill="var(--ink-faint)">
                    bucket 0 — empty
                  </text>
                  <rect
                    x="36"
                    y="34"
                    width="100"
                    height="30"
                    rx="15"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="1.5"
                  />
                  <text
                    x="86"
                    y="54"
                    text-anchor="middle"
                    font-size="11"
                    font-weight="700"
                    fill="var(--val)">
                    thread A
                  </text>
                  <line
                    x1="86"
                    y1="66"
                    x2="86"
                    y2="84"
                    stroke="var(--val)"
                    stroke-width="2"
                  />
                  <text
                    x="86"
                    y="150"
                    text-anchor="middle"
                    font-size="10.5"
                    font-weight="700"
                    fill="var(--val)">
                    CAS — no lock
                  </text>

                  <!-- bucket 1 -->
                  <rect
                    x="188"
                    y="88"
                    width="140"
                    height="42"
                    rx="6"
                    fill="var(--hot-bg)"
                    stroke="var(--hot)"
                    stroke-width="2"
                  />
                  <text
                    x="258"
                    y="114"
                    text-anchor="middle"
                    font-size="11.5"
                    fill="var(--hot)">
                    bucket 1 — occupied
                  </text>
                  <rect
                    x="208"
                    y="34"
                    width="100"
                    height="30"
                    rx="15"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="1.5"
                  />
                  <text
                    x="258"
                    y="54"
                    text-anchor="middle"
                    font-size="11"
                    font-weight="700"
                    fill="var(--val)">
                    thread B
                  </text>
                  <line
                    x1="258"
                    y1="66"
                    x2="258"
                    y2="84"
                    stroke="var(--val)"
                    stroke-width="2"
                  />
                  <text
                    x="258"
                    y="150"
                    text-anchor="middle"
                    font-size="10.5"
                    font-weight="700"
                    fill="var(--hot)">
                    locks THIS bin only
                  </text>
                  <rect
                    x="243"
                    y="160"
                    width="30"
                    height="24"
                    rx="4"
                    fill="var(--hot)"
                  />
                  <rect
                    x="251"
                    y="152"
                    width="14"
                    height="14"
                    rx="7"
                    fill="none"
                    stroke="var(--hot)"
                    stroke-width="2.5"
                  />

                  <!-- bucket 2 -->
                  <rect
                    x="360"
                    y="88"
                    width="140"
                    height="42"
                    rx="6"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="2"
                    stroke-dasharray="5 4"
                  />
                  <text
                    x="430"
                    y="114"
                    text-anchor="middle"
                    font-size="11.5"
                    fill="var(--ink-faint)">
                    bucket 2 — empty
                  </text>
                  <rect
                    x="380"
                    y="34"
                    width="100"
                    height="30"
                    rx="15"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="1.5"
                  />
                  <text
                    x="430"
                    y="54"
                    text-anchor="middle"
                    font-size="11"
                    font-weight="700"
                    fill="var(--val)">
                    thread C
                  </text>
                  <line
                    x1="430"
                    y1="66"
                    x2="430"
                    y2="84"
                    stroke="var(--val)"
                    stroke-width="2"
                  />
                  <text
                    x="430"
                    y="150"
                    text-anchor="middle"
                    font-size="10.5"
                    font-weight="700"
                    fill="var(--val)">
                    CAS — no lock
                  </text>

                  <!-- bucket 3 read -->
                  <rect
                    x="532"
                    y="88"
                    width="150"
                    height="42"
                    rx="6"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2"
                  />
                  <text
                    x="607"
                    y="114"
                    text-anchor="middle"
                    font-size="11.5"
                    fill="var(--val)">
                    bucket 3 — reading
                  </text>
                  <rect
                    x="557"
                    y="34"
                    width="100"
                    height="30"
                    rx="15"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="1.5"
                  />
                  <text
                    x="607"
                    y="54"
                    text-anchor="middle"
                    font-size="11"
                    font-weight="700"
                    fill="var(--key)">
                    thread D
                  </text>
                  <line
                    x1="607"
                    y1="66"
                    x2="607"
                    y2="84"
                    stroke="var(--key)"
                    stroke-width="2"
                  />
                  <text
                    x="607"
                    y="150"
                    text-anchor="middle"
                    font-size="10.5"
                    font-weight="700"
                    fill="var(--key)">
                    get() never blocks
                  </text>

                  <text x="12" y="212" font-size="11" fill="var(--ink-faint)">
                    Compare Hashtable: all four threads would queue on one lock
                    covering the entire table.
                  </text>
                  <text x="12" y="232" font-size="11" fill="var(--ink-faint)">
                    Contention here scales with the number of buckets, which
                    grows with the map.
                  </text>
                </g>
              </svg>