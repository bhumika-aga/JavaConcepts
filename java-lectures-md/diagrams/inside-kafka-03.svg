<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250"
                viewBox="0 0 700 250"
                role="img"
                aria-label="The three acks settings compared against a leader and two follower replicas, showing what each one risks"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <g font-family="JetBrains Mono, monospace" font-size="11.5">
                  <text x="12" y="18" font-size="11" fill="var(--ink-faint)">
                    one partition, replication factor 3
                  </text>

                  <rect
                    x="250"
                    y="30"
                    width="200"
                    height="40"
                    rx="6"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="2.5"
                  />
                  <text
                    x="350"
                    y="55"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="700"
                    fill="var(--key)">
                    LEADER
                  </text>
                  <rect
                    x="250"
                    y="78"
                    width="200"
                    height="34"
                    rx="6"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="350"
                    y="100"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink-soft)">
                    follower 1 (in ISR)
                  </text>
                  <rect
                    x="250"
                    y="118"
                    width="200"
                    height="34"
                    rx="6"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="350"
                    y="140"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink-soft)">
                    follower 2 (in ISR)
                  </text>

                  <rect
                    x="12"
                    y="176"
                    width="216"
                    height="62"
                    rx="7"
                    fill="var(--hot-bg)"
                    stroke="var(--hot)"
                    stroke-width="2.5"
                  />
                  <text
                    x="120"
                    y="197"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="700"
                    fill="var(--hot)">
                    acks = 0
                  </text>
                  <text
                    x="120"
                    y="214"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--hot)">
                    never waits, never knows
                  </text>
                  <text
                    x="120"
                    y="229"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--hot)">
                    loses data freely
                  </text>

                  <rect
                    x="242"
                    y="176"
                    width="216"
                    height="62"
                    rx="7"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="2.5"
                  />
                  <text
                    x="350"
                    y="197"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="700"
                    fill="var(--key)">
                    acks = 1
                  </text>
                  <text
                    x="350"
                    y="214"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--key)">
                    leader only
                  </text>
                  <text
                    x="350"
                    y="229"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--key)">
                    leader dies → record gone
                  </text>

                  <rect
                    x="472"
                    y="176"
                    width="216"
                    height="62"
                    rx="7"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2.5"
                  />
                  <text
                    x="580"
                    y="197"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="700"
                    fill="var(--val)">
                    acks = all
                  </text>
                  <text
                    x="580"
                    y="214"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--val)">
                    every in-sync replica
                  </text>
                  <text
                    x="580"
                    y="229"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--val)">
                    survives a leader failure
                  </text>

                  <text x="480" y="52" font-size="10.5" fill="var(--ink-faint)">
                    ISR = replicas caught
                  </text>
                  <text x="480" y="68" font-size="10.5" fill="var(--ink-faint)">
                    up with the leader
                  </text>
                  <text
                    x="480"
                    y="96"
                    font-size="10.5"
                    font-weight="700"
                    fill="var(--val)">
                    acks=all alone is
                  </text>
                  <text
                    x="480"
                    y="112"
                    font-size="10.5"
                    font-weight="700"
                    fill="var(--val)">
                    not enough →
                  </text>
                  <text x="480" y="134" font-size="10.5" fill="var(--ink-soft)">
                    pair it with
                  </text>
                  <text x="480" y="150" font-size="10.5" fill="var(--ink-soft)">
                    min.insync.replicas=2
                  </text>
                </g>
              </svg>