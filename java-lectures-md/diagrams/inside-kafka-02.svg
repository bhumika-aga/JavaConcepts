<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260"
                viewBox="0 0 700 260"
                role="img"
                aria-label="A record key hashed to choose one of three partitions, with all records sharing a key landing in the same partition"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <defs>
                  <marker
                    id="k2"
                    viewBox="0 0 10 10"
                    refX="9"
                    refY="5"
                    markerWidth="7"
                    markerHeight="7"
                    orient="auto">
                    <path d="M0 0 L10 5 L0 10 z" fill="currentColor" />
                  </marker>
                </defs>
                <g font-family="JetBrains Mono, monospace" font-size="11.5">
                  <rect
                    x="12"
                    y="60"
                    width="130"
                    height="52"
                    rx="7"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="2.5"
                  />
                  <text
                    x="77"
                    y="82"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="700"
                    fill="var(--key)">
                    key = "user-42"
                  </text>
                  <text
                    x="77"
                    y="100"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--key)">
                    the record key
                  </text>

                  <g color="var(--ink-soft)">
                    <line
                      x1="146"
                      y1="86"
                      x2="186"
                      y2="86"
                      stroke="currentColor"
                      stroke-width="2"
                      marker-end="url(#k2)"
                    />
                  </g>

                  <rect
                    x="192"
                    y="60"
                    width="164"
                    height="52"
                    rx="7"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="2"
                  />
                  <text
                    x="274"
                    y="82"
                    text-anchor="middle"
                    font-size="11.5"
                    font-weight="700"
                    fill="var(--ink)">
                    hash(key) % 3
                  </text>
                  <text
                    x="274"
                    y="100"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--ink-faint)">
                    the default partitioner
                  </text>

                  <g color="var(--ink-soft)">
                    <line
                      x1="360"
                      y1="86"
                      x2="400"
                      y2="86"
                      stroke="currentColor"
                      stroke-width="2"
                      marker-end="url(#k2)"
                    />
                  </g>

                  <text x="410" y="20" font-size="11" fill="var(--ink-faint)">
                    TOPIC "orders" — 3 independent logs
                  </text>

                  <rect
                    x="406"
                    y="34"
                    width="280"
                    height="40"
                    rx="6"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text x="424" y="59" font-size="11.5" fill="var(--ink-faint)">
                    P0
                  </text>
                  <text x="470" y="59" font-size="11" fill="var(--ink-soft)">
                    · · · · ·
                  </text>

                  <rect
                    x="406"
                    y="80"
                    width="280"
                    height="40"
                    rx="6"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2.5"
                  />
                  <text
                    x="424"
                    y="105"
                    font-size="11.5"
                    font-weight="700"
                    fill="var(--val)">
                    P1
                  </text>
                  <text
                    x="470"
                    y="105"
                    font-size="11"
                    font-weight="700"
                    fill="var(--val)">
                    user-42 · user-42 · user-42
                  </text>

                  <rect
                    x="406"
                    y="126"
                    width="280"
                    height="40"
                    rx="6"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="424"
                    y="151"
                    font-size="11.5"
                    fill="var(--ink-faint)">
                    P2
                  </text>
                  <text x="470" y="151" font-size="11" fill="var(--ink-soft)">
                    · · · · ·
                  </text>

                  <text
                    x="406"
                    y="192"
                    font-size="11"
                    font-weight="700"
                    fill="var(--val)">
                    Same key → same partition → ordered
                  </text>
                  <text x="406" y="210" font-size="11" fill="var(--hot)">
                    Across P0/P1/P2 there is no order at all.
                  </text>

                  <rect
                    x="12"
                    y="180"
                    width="360"
                    height="62"
                    rx="7"
                    fill="var(--hot-bg)"
                    stroke="var(--hot)"
                    stroke-width="2"
                  />
                  <text
                    x="192"
                    y="203"
                    text-anchor="middle"
                    font-size="11.5"
                    font-weight="700"
                    fill="var(--hot)">
                    key = null → no ordering guarantee
                  </text>
                  <text
                    x="192"
                    y="222"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--hot)">
                    records are spread across partitions for throughput
                  </text>
                </g>
              </svg>