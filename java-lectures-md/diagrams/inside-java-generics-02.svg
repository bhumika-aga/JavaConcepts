<svg xmlns="http://www.w3.org/2000/svg" width="700" height="190"
                viewBox="0 0 700 190"
                role="img"
                aria-label="One generic class declaration substituting three different type arguments to produce three distinct compile-time types"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <defs>
                  <marker
                    id="g2"
                    viewBox="0 0 10 10"
                    refX="9"
                    refY="5"
                    markerWidth="7"
                    markerHeight="7"
                    orient="auto">
                    <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-soft)" />
                  </marker>
                </defs>
                <g font-family="JetBrains Mono, monospace" font-size="11.5">
                  <text x="12" y="18" font-size="11" fill="var(--ink-faint)">
                    ONE DECLARATION
                  </text>
                  <rect
                    x="12"
                    y="66"
                    width="168"
                    height="58"
                    rx="8"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
