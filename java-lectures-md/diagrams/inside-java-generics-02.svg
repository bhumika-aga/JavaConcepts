                  />
                  <text
                    x="96"
                    y="90"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="700"
                    fill="var(--key)">
                    class Box&lt;T&gt;
                  </text>
                  <text
                    x="96"
                    y="108"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--key)">
                    T put(T), T take()
                  </text>

                  <line
                    x1="186"
                    y1="95"
                    x2="228"
                    y2="60"
                    stroke="var(--ink-soft)"
                    stroke-width="2"
                    marker-end="url(#g2)"
                  />
                  <line
                    x1="186"
                    y1="95"
                    x2="228"
                    y2="95"
                    stroke="var(--ink-soft)"
                    stroke-width="2"
                    marker-end="url(#g2)"
                  />
                  <line
                    x1="186"
                    y1="95"
                    x2="228"
                    y2="130"
                    stroke="var(--ink-soft)"
                    stroke-width="2"
                    marker-end="url(#g2)"
                  />
                  <text x="196" y="46" font-size="10" fill="var(--ink-faint)">
                    T :=
                  </text>

                  <text x="300" y="18" font-size="11" fill="var(--ink-faint)">
