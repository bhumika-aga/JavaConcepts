                  <text
                    x="334"
                    y="166"
                    text-anchor="middle"
                    font-size="11.5"
                    font-weight="700"
                    fill="var(--val)">
                    Box&lt;List&lt;User&gt;&gt;
                  </text>

                  <text x="452" y="86" font-size="10.5" fill="var(--ink-faint)">
                    Box&lt;String&gt; is NOT assignable to
                  </text>
                  <text
                    x="452"
                    y="102"
                    font-size="10.5"
                    fill="var(--ink-faint)">
                    Box&lt;Integer&gt; — nor to Box&lt;Object&gt;.
                  </text>
                  <text x="452" y="126" font-size="10.5" fill="var(--key)">
                    They share a declaration,
                  </text>
                  <text x="452" y="142" font-size="10.5" fill="var(--key)">
                    not a subtype relationship.
                  </text>
                </g>
              </svg>