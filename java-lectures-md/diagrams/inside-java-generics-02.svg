                  />
                  <text
                    x="334"
                    y="55"
                    text-anchor="middle"
                    font-size="11.5"
                    font-weight="700"
                    fill="var(--val)">
                    Box&lt;String&gt;
                  </text>
                  <text
                    x="334"
                    y="71"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--val)">
                    String put(String)
                  </text>

                  <rect
                    x="234"
                    y="88"
                    width="200"
                    height="46"
                    rx="7"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2"
                  />
                  <text
                    x="334"
                    y="107"
                    text-anchor="middle"
                    font-size="11.5"
                    font-weight="700"
                    fill="var(--val)">
                    Box&lt;Integer&gt;
                  </text>
                  <text
                    x="334"
                    y="123"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--val)">
