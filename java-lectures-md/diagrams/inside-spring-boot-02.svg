<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280"
                viewBox="0 0 700 280"
                role="img"
                aria-label="A precedence ladder of configuration sources from command line arguments at the top down to defaults set in code at the bottom"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <g font-family="JetBrains Mono, monospace" font-size="11">
                  <text
                    x="12"
                    y="18"
                    font-size="11"
                    font-weight="700"
                    fill="var(--hot)">
                    HIGHEST — wins over everything below
                  </text>

                  <rect
                    x="12"
                    y="28"
                    width="500"
                    height="28"
                    rx="5"
                    fill="var(--hot-bg)"
                    stroke="var(--hot)"
                    stroke-width="2"
                  />
                  <text
                    x="26"
                    y="47"
                    font-size="11"
                    font-weight="700"
                    fill="var(--hot)">
                    command line --server.port=9000
                  </text>

                  <rect
                    x="12"
                    y="60"
                    width="500"
                    height="28"
                    rx="5"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="1.8"
                  />
                  <text x="26" y="79" font-size="11" fill="var(--key)">
                    SPRING_APPLICATION_JSON
                  </text>

                  <rect
                    x="12"
                    y="92"
                    width="500"
                    height="28"
                    rx="5"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="1.8"
                  />
                  <text x="26" y="111" font-size="11" fill="var(--key)">
                    system properties -Dserver.port=9000
                  </text>

                  <rect
                    x="12"
                    y="124"
                    width="500"
                    height="28"
                    rx="5"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="1.8"
                  />
                  <text x="26" y="143" font-size="11" fill="var(--key)">
                    OS environment SERVER_PORT=9000
                  </text>

                  <rect
                    x="12"
                    y="156"
                    width="500"
                    height="28"
                    rx="5"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.8"
                  />
                  <text x="26" y="175" font-size="11" fill="var(--ink)">
                    application-{profile}.yml outside the jar
                  </text>

                  <rect
                    x="12"
                    y="188"
                    width="500"
                    height="28"
                    rx="5"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.8"
                  />
                  <text x="26" y="207" font-size="11" fill="var(--ink)">
                    application.yml outside the jar
                  </text>

                  <rect
                    x="12"
                    y="220"
                    width="500"
                    height="28"
                    rx="5"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="1.8"
                  />
                  <text x="26" y="239" font-size="11" fill="var(--val)">
                    application.yml inside the jar
                  </text>

                  <text
                    x="12"
                    y="270"
                    font-size="11"
                    font-weight="700"
                    fill="var(--val)">
                    LOWEST — defaults set in code
                  </text>

                  <text x="526" y="47" font-size="10" fill="var(--ink-faint)">
                    deploys
                  </text>
                  <text x="526" y="143" font-size="10" fill="var(--ink-faint)">
                    containers,
                  </text>
                  <text x="526" y="157" font-size="10" fill="var(--ink-faint)">
                    Kubernetes
                  </text>
                  <text x="526" y="239" font-size="10" fill="var(--ink-faint)">
                    your default
                  </text>
                </g>
              </svg>