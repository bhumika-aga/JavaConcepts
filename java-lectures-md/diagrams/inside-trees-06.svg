<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220" viewBox="0 0 700 220" role="img" aria-label="A trie storing car, cat and dog, where the path spells the word and terminal nodes are marked"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
        <g font-family="JetBrains Mono, monospace" font-size="11">
          <circle cx="80" cy="106" r="16" fill="var(--surface-2)" stroke="var(--rule-strong)" stroke-width="2"/>
          <text x="80" y="111" text-anchor="middle" font-size="10" fill="var(--ink-faint)">·</text>
          <text x="80" y="140" text-anchor="middle" font-size="9.5" fill="var(--ink-faint)">root</text>

          <line x1="96" y1="98" x2="140" y2="70" stroke="var(--val)" stroke-width="2"/>
          <line x1="96" y1="114" x2="140" y2="160" stroke="var(--key)" stroke-width="2"/>

          <circle cx="156" cy="62" r="16" fill="var(--val-bg)" stroke="var(--val)" stroke-width="2.5"/>
          <text x="156" y="67" text-anchor="middle" font-size="11" font-weight="700" fill="var(--val)">c</text>
          <line x1="172" y1="62" x2="208" y2="62" stroke="var(--val)" stroke-width="2"/>
          <circle cx="224" cy="62" r="16" fill="var(--val-bg)" stroke="var(--val)" stroke-width="2.5"/>
          <text x="224" y="67" text-anchor="middle" font-size="11" font-weight="700" fill="var(--val)">a</text>

          <line x1="240" y1="54" x2="276" y2="34" stroke="var(--val)" stroke-width="2"/>
          <line x1="240" y1="70" x2="276" y2="90" stroke="var(--val)" stroke-width="2"/>

          <circle cx="292" cy="28" r="16" fill="var(--val)" stroke="var(--val)" stroke-width="2.5"/>
          <text x="292" y="33" text-anchor="middle" font-size="11" font-weight="700" fill="var(--surface)">r</text>
          <text x="322" y="33" font-size="10.5" font-weight="700" fill="var(--val)">"car"</text>

          <circle cx="292" cy="96" r="16" fill="var(--val)" stroke="var(--val)" stroke-width="2.5"/>
          <text x="292" y="101" text-anchor="middle" font-size="11" font-weight="700" fill="var(--surface)">t</text>
          <text x="322" y="101" font-size="10.5" font-weight="700" fill="var(--val)">"cat"</text>

          <circle cx="156" cy="168" r="16" fill="var(--key-bg)" stroke="var(--key)" stroke-width="2.5"/>
          <text x="156" y="173" text-anchor="middle" font-size="11" font-weight="700" fill="var(--key)">d</text>
          <line x1="172" y1="168" x2="208" y2="168" stroke="var(--key)" stroke-width="2"/>
          <circle cx="224" cy="168" r="16" fill="var(--key-bg)" stroke="var(--key)" stroke-width="2.5"/>
          <text x="224" y="173" text-anchor="middle" font-size="11" font-weight="700" fill="var(--key)">o</text>
          <line x1="240" y1="168" x2="276" y2="168" stroke="var(--key)" stroke-width="2"/>
          <circle cx="292" cy="168" r="16" fill="var(--key)" stroke="var(--key)" stroke-width="2.5"/>
          <text x="292" y="173" text-anchor="middle" font-size="11" font-weight="700" fill="var(--surface)">g</text>
          <text x="322" y="173" font-size="10.5" font-weight="700" fill="var(--key)">"dog"</text>

          <text x="420" y="40" font-size="10.5" fill="var(--ink-soft)">filled = end of a word</text>
          <text x="420" y="66" font-size="10.5" font-weight="700" fill="var(--ink)">lookup is O(m)</text>
          <text x="420" y="82" font-size="10" fill="var(--ink-faint)">m = key length, NOT the</text>
          <text x="420" y="96" font-size="10" fill="var(--ink-faint)">number of keys stored</text>
          <text x="420" y="124" font-size="10.5" font-weight="700" fill="var(--val)">"ca" → every word</text>
          <text x="420" y="140" font-size="10.5" font-weight="700" fill="var(--val)">beneath that node</text>
          <text x="420" y="156" font-size="10" fill="var(--ink-faint)">autocomplete, in one walk</text>
          <text x="420" y="184" font-size="10.5" fill="var(--hot)">not in the JDK — write it</text>
          <text x="420" y="200" font-size="10.5" fill="var(--hot)">or use Apache Commons</text>
        </g>
      </svg>