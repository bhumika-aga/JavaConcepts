<svg xmlns="http://www.w3.org/2000/svg" width="700" height="210"
                viewBox="0 0 700 210"
                role="img"
                aria-label="An entry surviving while a strong reference exists, then vanishing after that reference is dropped and GC runs"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <g font-family="JetBrains Mono, monospace" font-size="11.5">
                  <text
                    x="12"
                    y="20"
                    font-size="11"
                    font-weight="700"
                    fill="var(--good)">
                    WHILE someone else holds the key
                  </text>

                  <rect
                    x="14"
                    y="34"
                    width="120"
                    height="36"
                    rx="6"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="74"
                    y="57"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink)">
                    your code
                  </text>
                  <line
                    x1="136"
                    y1="52"
                    x2="204"
                    y2="52"
                    stroke="var(--good)"
                    stroke-width="2.5"
                  />
                  <text
                    x="170"
                    y="44"
                    text-anchor="middle"
                    font-size="9.5"
                    font-weight="700"
                    fill="var(--good)">
                    strong
                  </text>

                  <rect
                    x="208"
                    y="34"
                    width="96"
                    height="36"
                    rx="6"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="2"
                  />
                  <text
                    x="256"
                    y="57"
                    text-anchor="middle"
                    font-size="11"
                    font-weight="700"
                    fill="var(--key)">
                    key
                  </text>

                  <line
                    x1="306"
                    y1="52"
                    x2="384"
                    y2="52"
                    stroke="var(--ink-faint)"
                    stroke-width="2"
                    stroke-dasharray="5 4"
                  />
                  <text
                    x="345"
                    y="44"
                    text-anchor="middle"
                    font-size="9.5"
                    fill="var(--ink-faint)">
                    weak
                  </text>

                  <rect
                    x="388"
                    y="34"
                    width="150"
                    height="36"
                    rx="6"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2"
                  />
                  <text
                    x="463"
                    y="57"
                    text-anchor="middle"
                    font-size="11"
                    font-weight="700"
                    fill="var(--val)">
                    entry alive
                  </text>

                  <line
                    x1="12"
                    y1="94"
                    x2="688"
                    y2="94"
                    stroke="var(--rule)"
                    stroke-width="1"
                  />

                  <text
                    x="12"
                    y="124"
                    font-size="11"
                    font-weight="700"
                    fill="var(--hot)">
                    AFTER that reference is dropped and the GC runs
                  </text>

                  <rect
                    x="14"
                    y="138"
                    width="120"
                    height="36"
                    rx="6"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                  />
                  <text
                    x="74"
                    y="161"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink)">
                    your code
                  </text>
                  <line
                    x1="136"
                    y1="156"
                    x2="204"
                    y2="156"
                    stroke="var(--hot)"
                    stroke-width="2"
                    stroke-dasharray="3 5"
                  />
                  <text
                    x="170"
                    y="148"
                    text-anchor="middle"
                    font-size="9.5"
                    font-weight="700"
                    fill="var(--hot)">
                    gone
                  </text>

                  <rect
                    x="208"
                    y="138"
                    width="96"
                    height="36"
                    rx="6"
                    fill="none"
                    stroke="var(--hot)"
                    stroke-width="1.5"
                    stroke-dasharray="5 4"
                  />
                  <text
                    x="256"
                    y="161"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--hot)">
                    collected
                  </text>

                  <line
                    x1="306"
                    y1="156"
                    x2="384"
                    y2="156"
                    stroke="var(--rule)"
                    stroke-width="1.5"
                    stroke-dasharray="3 5"
                  />

                  <rect
                    x="388"
                    y="138"
                    width="150"
                    height="36"
                    rx="6"
                    fill="none"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                    stroke-dasharray="5 4"
                  />
                  <text
                    x="463"
                    y="161"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--ink-faint)">
                    entry removed
                  </text>

                  <text
                    x="556"
                    y="161"
                    font-size="10.5"
                    fill="var(--ink-faint)">
                    size() drops
                  </text>
                  <text
                    x="556"
                    y="176"
                    font-size="10.5"
                    fill="var(--ink-faint)">
                    on its own
                  </text>
                </g>
              </svg>