                      stroke-width="1.5"
                    />
                    <text
                      x="75"
                      y="54"
                      text-anchor="middle"
                      font-weight="700"
                      fill="var(--key)">
                      MON
                    </text>
                    <text x="152" y="54" font-size="11" fill="var(--ink-faint)">
                      ordinal 0
                    </text>

                    <rect
                      x="14"
                      y="70"
                      width="122"
                      height="30"
                      rx="5"
                      fill="var(--key-bg)"
                      stroke="var(--key)"
                      stroke-width="1.5"
                    />
                    <text
                      x="75"
                      y="90"
                      text-anchor="middle"
                      font-weight="700"
                      fill="var(--key)">
                      TUE
                    </text>
                    <text x="152" y="90" font-size="11" fill="var(--ink-faint)">
                      ordinal 1
                    </text>

                    <rect
                      x="14"
                      y="106"
                      width="122"
                      height="30"
                      rx="5"
                      fill="var(--key-bg)"
                      stroke="var(--key)"
                      stroke-width="1.5"
                    />
                    <text
                      x="75"
                      y="126"
                      text-anchor="middle"
                      font-weight="700"
                      fill="var(--key)">
                      WED
                    </text>
                    <text
                      x="152"
                      y="126"
                      font-size="11"
                      fill="var(--ink-faint)">
                      ordinal 2
                    </text>

                    <rect
                      x="14"
                      y="142"
                      width="122"
                      height="30"
                      rx="5"
                      fill="var(--key-bg)"
                      stroke="var(--key)"
                      stroke-width="1.5"
                    />
                    <text
                      x="75"
                      y="162"
                      text-anchor="middle"
                      font-weight="700"
                      fill="var(--key)">
                      THU
                    </text>
                    <text
                      x="152"
                      y="162"
                      font-size="11"
                      fill="var(--ink-faint)">
