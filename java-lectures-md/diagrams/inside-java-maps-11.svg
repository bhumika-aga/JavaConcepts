                  </text>
                  <text x="562" y="90" font-size="11" fill="var(--ink-faint)">
                    vals[1]
                  </text>

                  <rect
                    x="400"
                    y="106"
                    width="150"
                    height="30"
                    rx="5"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="1.5"
                    stroke-dasharray="5 4"
                  />
                  <text
                    x="475"
                    y="126"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink-faint)">
                    absent
                  </text>
                  <text x="562" y="126" font-size="11" fill="var(--ink-faint)">
                    vals[2]
                  </text>

                  <rect
                    x="400"
                    y="142"
                    width="150"
                    height="30"
                    rx="5"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="1.5"
                  />
                  <text x="475" y="162" text-anchor="middle" fill="var(--val)">
                    "swim"
                  </text>
                  <text x="562" y="162" font-size="11" fill="var(--ink-faint)">
                    vals[3]
