<svg xmlns="http://www.w3.org/2000/svg" width="700" height="200"
                viewBox="0 0 700 200"
                role="img"
                aria-label="Enum constants mapping directly onto array slots by ordinal"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <g font-family="JetBrains Mono, monospace" font-size="11.5">
                  <text x="12" y="20" font-size="11" fill="var(--ink-faint)">
                    enum Day { MON, TUE, WED, THU, FRI }
                  </text>

                  <g>
                    <rect
                      x="14"
                      y="34"
                      width="122"
                      height="30"
                      rx="5"
