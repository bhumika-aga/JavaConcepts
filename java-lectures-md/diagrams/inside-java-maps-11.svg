                    y="120"
                    font-size="10.5"
                    fill="var(--ink-faint)">
                    no hash, no mask
                  </text>

                  <text x="400" y="20" font-size="11" fill="var(--ink-faint)">
                    Object[] vals
                  </text>
                  <rect
                    x="400"
                    y="34"
                    width="150"
                    height="30"
                    rx="5"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="1.5"
                  />
                  <text x="475" y="54" text-anchor="middle" fill="var(--val)">
                    "gym"
                  </text>
                  <text x="562" y="54" font-size="11" fill="var(--ink-faint)">
                    vals[0]
                  </text>

                  <rect
                    x="400"
                    y="70"
                    width="150"
                    height="30"
                    rx="5"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="1.5"
                  />
                  <text x="475" y="90" text-anchor="middle" fill="var(--val)">
