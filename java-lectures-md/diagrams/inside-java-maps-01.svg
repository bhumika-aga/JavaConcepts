                  />
                  <text
                    x="91"
                    y="44"
                    text-anchor="middle"
                    font-size="14"
                    font-weight="700"
                    fill="var(--key)">
                    "alice"
                  </text>
                  <text
                    x="91"
                    y="108"
                    text-anchor="middle"
                    font-size="15"
                    font-weight="700"
                    fill="var(--val)">
                    age 31
                  </text>
                  <text
                    x="91"
                    y="132"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink-faint)">
                    the value
                  </text>
                  <!-- cubby 2 -->
                  <rect
                    x="192"
                    y="54"
                    width="150"
                    height="118"
                    rx="8"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2"
                  />
                  <rect
                    x="210"
                    y="24"
                    width="114"
                    height="30"
                    rx="6"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="2"
                  />
                  <text
                    x="267"
                    y="44"
                    text-anchor="middle"
                    font-size="14"
                    font-weight="700"
                    fill="var(--key)">
                    "bob"
                  </text>
                  <text
                    x="267"
                    y="108"
                    text-anchor="middle"
                    font-size="15"
                    font-weight="700"
                    fill="var(--val)">
                    age 47
                  </text>
                  <!-- cubby 3 -->
                  <rect
                    x="368"
                    y="54"
                    width="150"
                    height="118"
                    rx="8"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2"
                  />
                  <rect
                    x="386"
                    y="24"
                    width="114"
                    height="30"
                    rx="6"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="2"
                  />
                  <text
                    x="443"
                    y="44"
                    text-anchor="middle"
                    font-size="14"
                    font-weight="700"
                    fill="var(--key)">
                    "carol"
                  </text>
                  <text
                    x="443"
                    y="108"
                    text-anchor="middle"
                    font-size="15"
                    font-weight="700"
                    fill="var(--val)">
                    age 29
                  </text>
                  <!-- cubby 4 empty -->
                  <rect
                    x="544"
                    y="54"
                    width="140"
                    height="118"
                    rx="8"
                    fill="none"
                    stroke="var(--rule-strong)"
                    stroke-width="2"
                    stroke-dasharray="6 5"
                  />
                  <text
                    x="614"
                    y="118"
                    text-anchor="middle"
                    font-size="13"
                    fill="var(--ink-faint)">
