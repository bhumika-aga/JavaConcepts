<svg xmlns="http://www.w3.org/2000/svg" width="700" height="230" viewBox="0 0 700 230" role="img" aria-label="A binary search tree with the path to a target value highlighted, discarding half the remaining tree at each step"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
        <g font-family="JetBrains Mono, monospace" font-size="11">
          <line x1="330" y1="46" x2="200" y2="102" stroke="var(--key)" stroke-width="3.5"/>
          <line x1="330" y1="46" x2="460" y2="102" stroke="var(--rule-strong)" stroke-width="2"/>
          <line x1="200" y1="130" x2="130" y2="176" stroke="var(--rule-strong)" stroke-width="2"/>
          <line x1="200" y1="130" x2="270" y2="176" stroke="var(--key)" stroke-width="3.5"/>
          <line x1="460" y1="130" x2="400" y2="176" stroke="var(--rule-strong)" stroke-width="2"/>
          <line x1="460" y1="130" x2="520" y2="176" stroke="var(--rule-strong)" stroke-width="2"/>

          <circle cx="330" cy="40" r="22" fill="var(--key-bg)" stroke="var(--key)" stroke-width="3"/>
          <text x="330" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="var(--key)">50</text>

          <circle cx="200" cy="116" r="21" fill="var(--key-bg)" stroke="var(--key)" stroke-width="3"/>
          <text x="200" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="var(--key)">30</text>
          <circle cx="460" cy="116" r="21" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="2.5"/>
          <text x="460" y="122" text-anchor="middle" font-size="12" fill="var(--ink-soft)">70</text>

          <circle cx="130" cy="190" r="20" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="2.5"/>
          <text x="130" y="196" text-anchor="middle" font-size="12" fill="var(--ink-soft)">20</text>
          <circle cx="270" cy="190" r="20" fill="var(--val-bg)" stroke="var(--val)" stroke-width="3.5"/>
          <text x="270" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="var(--val)">40</text>
          <circle cx="400" cy="190" r="20" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="2.5"/>
          <text x="400" y="196" text-anchor="middle" font-size="12" fill="var(--ink-soft)">60</text>
          <circle cx="520" cy="190" r="20" fill="var(--surface)" stroke="var(--rule-strong)" stroke-width="2.5"/>
          <text x="520" y="196" text-anchor="middle" font-size="12" fill="var(--ink-soft)">80</text>

          <text x="12" y="24" font-size="11" font-weight="700" fill="var(--key)">searching for 40</text>
          <text x="560" y="46" font-size="10.5" fill="var(--ink-soft)">40 &lt; 50 → go left</text>
          <text x="560" y="122" font-size="10.5" fill="var(--ink-soft)">40 &gt; 30 → go right</text>
          <text x="560" y="196" font-size="10.5" font-weight="700" fill="var(--val)">found</text>

          <text x="12" y="220" font-size="10.5" fill="var(--ink-soft)">Each comparison discards half of what's left — which is where log n comes from.</text>
        </g>
      </svg>