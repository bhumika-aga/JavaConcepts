<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260"
                viewBox="0 0 700 260"
                role="img"
                aria-label="An external caller goes through the proxy and gets a transaction, while an internal this-call goes straight to the target and is not intercepted"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <defs>
                  <marker
                    id="s3"
                    viewBox="0 0 10 10"
                    refX="9"
                    refY="5"
                    markerWidth="7"
                    markerHeight="7"
                    orient="auto">
                    <path d="M0 0 L10 5 L0 10 z" fill="currentColor" />
                  </marker>
                </defs>
                <g font-family="JetBrains Mono, monospace" font-size="11.5">
                  <text x="12" y="18" font-size="11" fill="var(--val)">
                    EXTERNAL CALL — intercepted
                  </text>

                  <rect
                    x="12"
                    y="30"
                    width="128"
                    height="42"
                    rx="7"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="2"
                  />
                  <text
                    x="76"
                    y="56"
                    text-anchor="middle"
                    font-size="11"
                    fill="var(--ink)">
                    Controller
                  </text>

                  <g color="var(--val)">
                    <line
                      x1="146"
                      y1="51"
                      x2="184"
                      y2="51"
                      stroke="currentColor"
                      stroke-width="2.5"
                      marker-end="url(#s3)"
                    />
                  </g>

                  <rect
                    x="190"
                    y="24"
                    width="200"
                    height="54"
                    rx="8"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="3"
                  />
                  <text
                    x="290"
                    y="45"
                    text-anchor="middle"
                    font-size="11.5"
                    font-weight="700"
                    fill="var(--val)">
                    PROXY
                  </text>
                  <text
                    x="290"
                    y="62"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--val)">
                    begin tx · call · commit
                  </text>

                  <g color="var(--val)">
                    <line
                      x1="396"
                      y1="51"
                      x2="434"
                      y2="51"
                      stroke="currentColor"
                      stroke-width="2.5"
                      marker-end="url(#s3)"
                    />
                  </g>

                  <rect
                    x="440"
                    y="24"
                    width="248"
                    height="54"
                    rx="8"
                    fill="var(--surface)"
                    stroke="var(--ink)"
                    stroke-width="2.5"
                  />
                  <text
                    x="564"
                    y="45"
                    text-anchor="middle"
                    font-size="11.5"
                    font-weight="700"
                    fill="var(--ink)">
                    your OrderService
                  </text>
                  <text
                    x="564"
                    y="62"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--ink-soft)">
                    save() — no tx code in it
                  </text>

                  <line
                    x1="12"
                    y1="100"
                    x2="688"
                    y2="100"
                    stroke="var(--rule)"
                    stroke-width="1"
                  />

                  <text x="12" y="126" font-size="11" fill="var(--hot)">
                    INTERNAL CALL — this.other() skips the proxy entirely
                  </text>

                  <rect
                    x="190"
                    y="140"
                    width="200"
                    height="54"
                    rx="8"
                    fill="var(--surface-2)"
                    stroke="var(--rule-strong)"
                    stroke-width="2"
                    stroke-dasharray="7 5"
                  />
                  <text
                    x="290"
                    y="161"
                    text-anchor="middle"
                    font-size="11.5"
                    font-weight="700"
                    fill="var(--ink-faint)">
                    PROXY
                  </text>
                  <text
                    x="290"
                    y="178"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--ink-faint)">
                    never consulted
                  </text>

                  <rect
                    x="440"
                    y="140"
                    width="248"
                    height="54"
                    rx="8"
                    fill="var(--hot-bg)"
                    stroke="var(--hot)"
                    stroke-width="3"
                  />
                  <text
                    x="564"
                    y="161"
                    text-anchor="middle"
                    font-size="11.5"
                    font-weight="700"
                    fill="var(--hot)">
                    save() → this.audit()
                  </text>
                  <text
                    x="564"
                    y="178"
                    text-anchor="middle"
                    font-size="10.5"
                    fill="var(--hot)">
                    @Transactional ignored
                  </text>

                  <path
                    d="M600 196 C600 216, 520 216, 500 200"
                    fill="none"
                    stroke="var(--hot)"
                    stroke-width="2.5"
                    stroke-dasharray="6 4"
                  />
                  <text
                    x="12"
                    y="222"
                    font-size="11"
                    font-weight="700"
                    fill="var(--hot)">
                    The annotation is on the method — but nothing is watching
                    the call.
                  </text>
                  <text x="12" y="242" font-size="11" fill="var(--ink-soft)">
                    No error, no warning, no transaction. It simply does
                    nothing.
                  </text>
                </g>
              </svg>