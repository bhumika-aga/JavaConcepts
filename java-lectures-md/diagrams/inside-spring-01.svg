<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240"
                viewBox="0 0 700 240"
                role="img"
                aria-label="Without a container a service constructs its own dependencies and is welded to them; with a container the service declares what it needs and the container supplies it"><style>svg{--bg:#F3F5F1; --surface:#FBFCFA; --surface-2:#E9EDE6; --ink:#15191B; --ink-soft:#59635F; --ink-faint:#808A85; --rule:#D6DCD3; --rule-strong:#B9C2B5; --key:#A85B00; --key-bg:#F6E8D5; --val:#0B6E75; --val-bg:#D8ECEC; --hot:#B33A2B; --hot-bg:#F7E2DE; --tree:#5E4B8B; --tree-bg:#E7E2F2; --good:#2F6B43;}@media(prefers-color-scheme:dark){svg{--bg:#13181A; --surface:#1A2023; --surface-2:#222A2D; --ink:#E9ECE8; --ink-soft:#A3ADA8; --ink-faint:#7C8782; --rule:#2B3336; --rule-strong:#3D4749; --key:#E5A75B; --key-bg:#3A2C17; --val:#4FC7D2; --val-bg:#123034; --hot:#E87862; --hot-bg:#3B211C; --tree:#AC9BDB; --tree-bg:#2A2440; --good:#6FBF8B;}}</style>
                <defs>
                  <marker
                    id="s1"
                    viewBox="0 0 10 10"
                    refX="9"
                    refY="5"
                    markerWidth="7"
                    markerHeight="7"
                    orient="auto">
                    <path d="M0 0 L10 5 L0 10 z" fill="currentColor" />
                  </marker>
                </defs>
                <g font-family="JetBrains Mono, monospace" font-size="11.5">
                  <text x="12" y="18" font-size="11" fill="var(--hot)">
                    WITHOUT — the service builds its own
                  </text>
                  <rect
                    x="12"
                    y="30"
                    width="300"
                    height="76"
                    rx="8"
                    fill="var(--hot-bg)"
                    stroke="var(--hot)"
                    stroke-width="2.5"
                  />
                  <text x="28" y="52" font-size="11" fill="var(--ink)">
                    class OrderService {
                  </text>
                  <text x="28" y="70" font-size="11" fill="var(--hot)">
                    Repo r = new MySqlRepo();
                  </text>
                  <text x="28" y="88" font-size="11" fill="var(--hot)">
                    Mailer m = new SmtpMailer();
                  </text>
                  <text x="12" y="128" font-size="10.5" fill="var(--ink-soft)">
                    Welded to MySQL and SMTP.
                  </text>
                  <text x="12" y="146" font-size="10.5" fill="var(--ink-soft)">
                    Untestable without both running.
                  </text>

                  <line
                    x1="12"
                    y1="170"
                    x2="688"
                    y2="170"
                    stroke="var(--rule)"
                    stroke-width="1"
                  />

                  <text x="360" y="18" font-size="11" fill="var(--val)">
                    WITH — it just asks
                  </text>
                  <rect
                    x="360"
                    y="30"
                    width="328"
                    height="76"
                    rx="8"
                    fill="var(--val-bg)"
                    stroke="var(--val)"
                    stroke-width="2.5"
                  />
                  <text x="376" y="52" font-size="11" fill="var(--ink)">
                    class OrderService {
                  </text>
                  <text x="376" y="70" font-size="11" fill="var(--val)">
                    OrderService(Repo r, Mailer m)
                  </text>
                  <text x="376" y="88" font-size="11" fill="var(--ink)">}</text>
                  <text x="360" y="128" font-size="10.5" fill="var(--ink-soft)">
                    Swap either one freely.
                  </text>
                  <text x="360" y="146" font-size="10.5" fill="var(--ink-soft)">
                    Test with plain fakes, no Spring.
                  </text>

                  <rect
                    x="180"
                    y="188"
                    width="340"
                    height="42"
                    rx="8"
                    fill="var(--key-bg)"
                    stroke="var(--key)"
                    stroke-width="2.5"
                  />
                  <text
                    x="350"
                    y="214"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="700"
                    fill="var(--key)">
                    the container decides and supplies
                  </text>
                </g>
              </svg>